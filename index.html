<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Scouting</title>
<meta name="theme-color" content="#0F1512">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#4A4172;
  --surface:#564C82;
  --surface-2:#605584;
  --surface-3:#6C6092;
  --line:#6E62A0;
  --text:#FCFAFF;
  --text-dim:#DCD1F2;
  --text-faint:#C1AEE0;
  --gold:#E8CE8A;
  --gold-dim:#B89F5C;
  --green:#E0A868;
  --red:#D97A6A;
  --neutral:#C9BEE8;
  --team1:#E8CE8A;
  --team2:#8FB0D6;
  --radius:14px;
  --radius-sm:8px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  overflow:hidden;
  position:fixed;
  inset:0;
}
#app{
  display:flex;
  flex-direction:column;
  height:100%;
  width:100%;
}
.topbar{
  padding:14px 18px 12px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  flex-shrink:0;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  position:relative;
}
.app-cover{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:calc(10px + var(--safe-top)) 18px 0;
  background:var(--surface);
  flex-shrink:0;
}
.app-cover img{
  max-width:220px;
  width:100%;
  height:auto;
  border-radius:10px;
}
.topbar h1{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:20px;
  letter-spacing:0.02em;
  text-transform:uppercase;
  margin:0;
  color:var(--text);
}
.topbar .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--gold);
  letter-spacing:0.08em;
  text-transform:uppercase;
}
.topbar-sub{display:flex;flex-direction:column;gap:2px;}
.topbar-action{
  background:var(--gold);
  color:#1A1408;
  border:none;
  border-radius:var(--radius-sm);
  padding:9px 14px;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:13px;
  white-space:nowrap;
}
.topbar-theme-btn{
  background:var(--surface-2);
  border:1px solid var(--line);
  padding:7px 10px;
  font-size:16px;
  line-height:1;
}
.topbar-actions-group{display:flex;align-items:center;gap:8px;}
.theme-picker{
  position:absolute;
  top:100%;
  right:18px;
  margin-top:6px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:10px;
  display:flex;
  gap:10px;
  z-index:30;
}
.theme-swatch{
  width:32px;
  height:32px;
  border-radius:50%;
  border:2px solid var(--line);
  padding:0;
  flex-shrink:0;
}
main{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:14px 14px calc(14px + var(--safe-bottom));
}
nav.bottomnav{
  display:flex;
  background:var(--surface);
  border-top:1px solid var(--line);
  flex-shrink:0;
  padding-bottom:var(--safe-bottom);
}
nav.bottomnav button{
  flex:1;
  background:none;
  border:none;
  color:var(--text-faint);
  padding:9px 4px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-family:'Inter',sans-serif;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:0.02em;
  text-transform:uppercase;
}
nav.bottomnav button .icon{font-size:20px;line-height:1;}
nav.bottomnav button.active{color:var(--gold);}
nav.bottomnav button.active .icon{filter:drop-shadow(0 0 6px rgba(196,160,82,0.35));}

/* generic components */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:10px;
}
.card:active{background:var(--surface-2);}
.shelf-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:9px 10px;
  margin-bottom:7px;
}
.shelf-card .match-date{font-size:10.5px;}
.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--text-faint);
}
.empty-state .icon{font-size:36px;margin-bottom:10px;opacity:0.6;}
.empty-state p{font-size:14px;line-height:1.5;margin:4px 0;}

.search-bar{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.search-bar input{
  flex:1;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  color:var(--text);
  font-size:14px;
  font-family:'Inter',sans-serif;
}
.search-bar input:focus{outline:none;border-color:var(--gold-dim);}

.chip-row{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:2px;
  margin-bottom:12px;
  -ms-overflow-style:none;
  scrollbar-width:none;
}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--text-dim);
  border-radius:100px;
  padding:6px 13px;
  font-size:12.5px;
  font-weight:500;
  white-space:nowrap;
}
.chip.active{background:var(--gold);border-color:var(--gold);color:#1A1408;font-weight:600;}

.section-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--text-faint);
  margin:18px 0 8px 2px;
}
.section-label:first-child{margin-top:0;}
.cat-rename-btn{
  background:transparent;
  border:none;
  font-size:13px;
  padding:2px 6px;
  flex-shrink:0;
  opacity:0.75;
}
.giornata-title{
  font-family:'Oswald',sans-serif;
  font-size:19px;
  font-weight:600;
  letter-spacing:0.01em;
  margin:20px 0 10px 2px;
  padding-bottom:6px;
  border-bottom:1px solid var(--line);
}
.giornata-title:first-child{margin-top:0;}
.giornata-num{
  font-size:21px;
  font-weight:700;
}
.cal-sticky{
  position:sticky;
  top:0;
  z-index:5;
  background:var(--bg);
}
.section-label.cal-sticky{padding:6px 0 8px 2px;margin-top:0;}
.giornata-title.cal-sticky{padding-top:6px;}

input, select, textarea{
  font-family:'Inter',sans-serif;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  color:var(--text);
  padding:10px 12px;
  font-size:14px;
  width:100%;
}
input:focus, select:focus, textarea:focus{outline:none;border-color:var(--gold-dim);}
label{
  display:block;
  font-size:11.5px;
  color:var(--text-faint);
  margin-bottom:5px;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:0.03em;
}
.field{margin-bottom:12px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}

.btn{
  border:none;
  border-radius:var(--radius-sm);
  padding:12px 16px;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:14px;
  width:100%;
  text-align:center;
}
.btn-primary{background:var(--gold);color:#1A1408;}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);}
.btn-sm{padding:8px 12px;font-size:13px;width:auto;}

::-webkit-scrollbar{width:0;height:0;}

.toast{
  position:fixed;
  bottom:calc(78px + var(--safe-bottom));
  left:50%;
  transform:translateX(-50%);
  background:var(--surface-3);
  border:1px solid var(--line);
  color:var(--text);
  padding:10px 18px;
  border-radius:100px;
  font-size:13px;
  font-weight:500;
  z-index:999;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.2s, transform 0.2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:340px;width:100%;}
.modal-message{color:var(--text);margin:0 0 16px;font-size:15px;line-height:1.4;}
.modal-input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:15px;margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;}

/* --- scout / calendario card --- */
.match-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
  margin-bottom:6px;
}
.match-date{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--gold);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.02em;
}
.match-comp{font-size:11px;color:var(--text-faint);text-align:right;}
.match-teams{
  font-family:'Oswald',sans-serif;
  font-size:18px;
  font-weight:500;
  letter-spacing:0.01em;
}
.match-teams .vs{color:var(--text-faint);font-weight:400;padding:0 2px;}

.cal-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 4px;
  border-bottom:1px solid var(--line);
}
.cal-row.is-selected{background:rgba(196,160,82,0.06);}
.cal-row-info{display:flex;flex-direction:column;gap:2px;min-width:0;}
.cal-row-time{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--text-faint);
}
.cal-row-teams{
  font-size:14.5px;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cal-row-comp{font-size:11px;color:var(--text-faint);}
.cal-row-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.del-btn{
  flex-shrink:0;
  border:none;
  background:transparent;
  color:var(--text-faint);
  font-size:15px;
  padding:6px 4px;
  line-height:1;
}
.toggle-btn{
  flex-shrink:0;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--text-dim);
  border-radius:100px;
  padding:7px 14px;
  font-size:12.5px;
  font-weight:600;
  font-family:'Inter',sans-serif;
}
.toggle-btn.on{background:var(--gold);border-color:var(--gold);color:#1A1408;}

/* --- squadre --- */
.team-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 2px;
  border-bottom:1px solid var(--line);
}
.team-row-name{font-size:14.5px;font-weight:500;flex:1;min-width:0;}
.team-row-controls{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.counter-group{display:flex;flex-direction:column;align-items:center;gap:2px;}
.counter-label{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.03em;}
.vista-chips{display:flex;gap:4px;}
.vista-chip{padding:5px 10px;font-size:11.5px;}
.counter{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:100px;
  padding:3px 4px;
}
.counter button{
  width:24px;height:24px;
  border-radius:50%;
  border:none;
  background:var(--surface-3);
  color:var(--text);
  font-size:15px;
  line-height:1;
  font-weight:600;
}
.counter span{font-family:'IBM Plex Mono',monospace;font-size:13px;min-width:16px;text-align:center;}
.team-row.has-views .team-row-name{color:var(--green);font-weight:600;}

/* --- schede list --- */
.sheet-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.sheet-card-name{font-family:'Oswald',sans-serif;font-size:17px;font-weight:500;}
.sheet-card-meta{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
.sheet-card-date{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--gold);
  flex-shrink:0;
}
.rating-bar{
  display:flex;
  height:5px;
  border-radius:100px;
  overflow:hidden;
  margin-top:12px;
  background:var(--surface-3);
}
.seg-v{background:var(--green);}
.seg-eq{background:var(--neutral);}
.seg-x{background:var(--red);}
.rating-legend{font-size:11px;color:var(--text-faint);margin-top:6px;}
.sheet-doc-link{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:4px 10px;}
.sheet-doc-link:active{opacity:0.7;}
.photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.photo-thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .photo-remove{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;border:none;font-size:12px;line-height:20px;text-align:center;padding:0;cursor:pointer;}
.photo-thumb .photo-uploading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.4);color:#fff;font-size:11px;text-align:center;padding:4px;}

/* --- scheda form --- */
.rating-group{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:4px 14px;
  margin-bottom:10px;
}
.rating-group-title{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--gold);
  padding:10px 0 6px;
}
.rating-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-top:1px solid var(--line);
}
.rating-row:first-of-type{border-top:none;}
.rating-label{font-size:13.5px;color:var(--text);}
.rating-toggle{display:flex;gap:5px;}
.rt-btn{
  width:30px;height:30px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--text-faint);
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:13px;
}
.rt-btn.active.rt-v{background:var(--green);border-color:var(--green);color:#0F1512;}
.rt-btn.active.rt-eq{background:var(--neutral);border-color:var(--neutral);color:#0F1512;}
.rt-btn.active.rt-x{background:var(--red);border-color:var(--red);color:#0F1512;}

.pitch-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.pitch-team-toggle, .pitch-mode-toggle{display:flex;gap:6px;}
.pt-btn, .pm-btn{
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--text-dim);
  border-radius:100px;
  padding:7px 12px;
  font-size:12px;
  font-weight:600;
}
.pt-btn{color:var(--dot-color);border-color:var(--line);}
.pt-btn.active{background:var(--surface-3);border-color:currentColor;}
.pm-btn.active{background:var(--gold);border-color:var(--gold);color:#1A1408;}

.pitch-wrap{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:10px;
}
#pitch-svg{
  width:72%;
  max-width:300px;
  height:auto;
  aspect-ratio:68/105;
  border-radius:8px;
  touch-action:manipulation;
  display:block;
  margin:0 auto;
}
.pitch-turf{fill:#16241C;}
.pitch-line-el{stroke:#3C5548;stroke-width:0.3;fill:none;}
.pitch-marker{stroke:#0F1512;stroke-width:0.3;}
.pitch-marker-label{fill:#0F1512;font-family:'IBM Plex Mono',monospace;font-weight:600;pointer-events:none;}
.pitch-arrow{stroke-width:0.6;}
.pitch-hint{
  font-size:11px;
  color:var(--text-faint);
  text-align:center;
  margin-top:8px;
}
</style>
</head>

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function exportBackup(){
  const sheets = JSON.parse(JSON.stringify(JSON.parse(localStorage.getItem(LS.sheets) || '[]')));
  // incorpora le foto come base64 nel backup, così il file resta completo e leggibile
  // anche fuori da Claude (es. su un sito indipendente) o su un altro dispositivo.
  for(const s of sheets){
    if(Array.isArray(s.immagini)){
      for(const img of s.immagini){
        if(img && img.url && !img.dataBase64){
          try{
            const resp = await fetch(img.url);
            const blob = await resp.blob();
            img.dataBase64 = await blobToBase64(blob);
          }catch(e){ /* se il download della foto fallisce, resta solo il riferimento originale */ }
        }
      }
    }
  }
  const data = {
    v: 2,
    exportedAt: new Date().toISOString(),
    matches: JSON.parse(localStorage.getItem(LS.matches) || '[]'),
    teams: JSON.parse(localStorage.getItem(LS.teams) || '[]'),
    sheets,
    theme: localStorage.getItem(LS.theme) || 'glicine'
  };
  const jsonStr = JSON.stringify(data, null, 2);
  const stamp = new Date().toISOString().slice(0,10);
  const filename = `scouting-backup-${stamp}.json`;

  let downloads = null;
  try{ downloads = window.claude ? await window.claude.use('downloads') : null; }catch(e){ downloads = null; }
  if(downloads){
    try{
      const blob = new Blob([jsonStr], { type: 'application/json' });
      await downloads.save({ filename, data: blob });
      toast('Backup esportato');
      return;
    }catch(err){
      if(err && err.code === 'declined') return;
      // qualsiasi altro errore: prova il download nativo del browser sotto
    }
  }
  try{
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('Backup esportato');
  }catch(e){
    showExportText('Backup dati (JSON)', jsonStr);
  }
}
// Unisce due elenchi per id: tiene la versione GIÀ presente quando lo stesso id esiste
// in entrambi (non sovrascrive nulla di locale), e aggiunge in coda i record del file
// che non esistono ancora qui. Così importare più volte da dispositivi diversi
// non fa mai perdere dati, né locali né del file.
function mergeById(localArr, importedArr){
  const seen = new Set(localArr.map(item => item.id));
  const merged = localArr.slice();
  importedArr.forEach(item => {
    if(item && item.id && !seen.has(item.id)){
      merged.push(item);
      seen.add(item.id);
    }
  });
  return merged;
}
function importBackupFile(file, mode){
  mode = mode === 'replace' ? 'replace' : 'merge';
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.matches) || !Array.isArray(data.teams) || !Array.isArray(data.sheets)){
        toast('File di backup non valido');
        return;
      }
      // se le foto sono state salvate come base64 nel backup, usale direttamente come
      // immagine: funzionano ovunque, senza dipendere dallo storage foto originale.
      const importedSheets = data.sheets.map(s => {
        if(Array.isArray(s.immagini)){
          s = Object.assign({}, s, {
            immagini: s.immagini.map(img => (img && img.dataBase64) ? Object.assign({}, img, { url: img.dataBase64 }) : img)
          });
        }
        return s;
      });

      let finalMatches, finalTeams, finalSheets;
      if(mode === 'replace'){
        finalMatches = data.matches;
        finalTeams = data.teams;
        finalSheets = importedSheets;
      } else {
        const localMatches = JSON.parse(localStorage.getItem(LS.matches) || '[]');
        const localTeams = JSON.parse(localStorage.getItem(LS.teams) || '[]');
        const localSheets = JSON.parse(localStorage.getItem(LS.sheets) || '[]');
        finalMatches = mergeById(localMatches, data.matches);
        finalTeams = mergeById(localTeams, data.teams);
        finalSheets = mergeById(localSheets, importedSheets);
      }

      localStorage.setItem(LS.matches, JSON.stringify(finalMatches));
      localStorage.setItem(LS.teams, JSON.stringify(finalTeams));
      try{
        localStorage.setItem(LS.sheets, JSON.stringify(finalSheets));
      }catch(quotaErr){
        // spazio esaurito per via delle foto in base64: riprova senza, avvisando l'utente
        const sheetsNoPhotos = finalSheets.map(s => Object.assign({}, s, { immagini: [] }));
        localStorage.setItem(LS.sheets, JSON.stringify(sheetsNoPhotos));
        toast('Backup importato, ma le foto erano troppo pesanti per lo spazio disponibile e non sono state importate');
      }
      if(mode === 'replace' && data.theme) localStorage.setItem(LS.theme, data.theme);
      toast(mode === 'replace' ? 'Backup ripristinato, ricarico...' : 'Backup unito, ricarico...');
      setTimeout(()=>location.reload(), 700);
    }catch(e){
      toast('Errore nella lettura del backup');
    }
  };
  reader.readAsText(file);
}

/* ============ EXPORT CALENDARIO (.ics) ============ */
function icsEscape(str){
  return String(str||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function icsDateTime(dataStr, oraStr){
  const [y,m,d] = dataStr.split('-');
  const time = oraStr ? oraStr.replace(':','') + '00' : '150000';
  return `${y}${m}${d}T${time}`;
}
function buildICS(matches){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Scouting App//IT'];
  matches.forEach(m => {
    const dtStart = icsDateTime(m.data, m.ora);
    let endTime;
    if(m.ora){
      let [hh,mm] = m.ora.split(':').map(Number);
      hh = (hh+2) % 24;
      endTime = `${String(hh).padStart(2,'0')}${String(mm).padStart(2,'0')}00`;
    } else {
      endTime = '170000';
    }
    const dtEnd = dtStart.slice(0,8) + 'T' + endTime;
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${m.id}@scouting-app`);
    lines.push(`DTSTART:${dtStart}`);
    lines.push(`DTEND:${dtEnd}`);
    lines.push(`SUMMARY:${icsEscape(m.casa + ' - ' + m.ospite)}`);
    lines.push(`DESCRIPTION:${icsEscape((m.competizione||'') + (m.girone?' · '+m.girone:''))}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadICS(filename, content){
  const blob = new Blob([content], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function gcalEventUrl(m){
  const start = icsDateTime(m.data, m.ora);
  let endTime;
  if(m.ora){
    let [hh,mm] = m.ora.split(':').map(Number);
    hh = (hh+2) % 24;
    endTime = `${String(hh).padStart(2,'0')}${String(mm).padStart(2,'0')}00`;
  } else {
    endTime = '170000';
  }
  const end = start.slice(0,8) + 'T' + endTime;
  const text = encodeURIComponent(`${m.casa} - ${m.ospite}`);
  const details = encodeURIComponent((m.competizione||'') + (m.girone ? ' · '+m.girone : ''));
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${start}/${end}&details=${details}`;
}

function loadMatches(){
  let raw = localStorage.getItem(LS.matches);
  if(!raw || getSeedVersion() < SEED_VERSION){
    const seeded = SEED_MATCHES.map(m => ({ id: uid(), ...m }));
    localStorage.setItem(LS.matches, JSON.stringify(seeded));
    return seeded;
  }
  const matches = JSON.parse(raw);
  let migrated = false;
  matches.forEach(m => {
    if(m.obiettivoCasa === undefined){
      m.obiettivoCasa = m.obiettivo || '';
      m.obiettivoOspite = '';
      migrated = true;
    }
  });
  if(migrated) saveMatches(matches);
  return matches;
}

function loadTeams(){

}

function weekday(iso){
  if(!iso) return '';
  const days = ['dom','lun','mar','mer','gio','ven','sab'];
  return days[new Date(iso+'T12:00:00').getDay()];
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}
function getModalOverlay(){
  let overlay = document.getElementById('modal-overlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'modal-overlay';
    overlay.className = 'modal-overlay';
    document.body.appendChild(overlay);
  }
  return overlay;
}
function closeModal(){
  const overlay = document.getElementById('modal-overlay');
  if(overlay){ overlay.classList.remove('show'); overlay.innerHTML=''; }
}
function showConfirm(message, onYes){
  const overlay = getModalOverlay();
  overlay.innerHTML = `
    <div class="modal-box">
      <p class="modal-message">${escapeHtml(message)}</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">Annulla</button>
        <button class="btn btn-danger" id="modal-ok">Conferma</button>
      </div>
    </div>
  `;
  overlay.classList.add('show');
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-ok').onclick = () => { closeModal(); onYes(); };
}
function showPrompt(message, defaultValue, onSubmit){
  const overlay = getModalOverlay();
  overlay.innerHTML = `
    <div class="modal-box">
      <p class="modal-message">${escapeHtml(message)}</p>
      <input type="text" id="modal-input" class="modal-input" value="${escapeHtml(defaultValue||'')}" />
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">Annulla</button>
        <button class="btn btn-primary" id="modal-ok">OK</button>
      </div>
    </div>
  `;
  overlay.classList.add('show');
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
  const input = document.getElementById('modal-input');
  setTimeout(()=>{ input.focus(); input.select(); }, 30);
  const submit = () => { const v = input.value; closeModal(); onSubmit(v); };
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-ok').onclick = submit;
  input.addEventListener('keydown', e => { if(e.key==='Enter') submit(); });
}
function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ MAIN RENDER ============ */
function scrollToCalendarioToday(){
  const rows = document.querySelectorAll('#page-content .cal-row[data-date]');
  if(!rows.length) return;
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  let target = null;
  rows.forEach(r => { if(!target && r.dataset.date >= todayStr) target = r; });
  if(!target) target = rows[rows.length-1];
  target.scrollIntoView({block:'start'});
}

function render(){
  try{
    renderTopbar();
    renderNav();
    const page = document.getElementById('page-content');
    page.scrollTop = 0;
    if(state.tab === 'scout') page.innerHTML = state.scoutView === 'archivio' ? renderScoutArchivioTab() : renderScoutTab();
    else if(state.tab === 'calendario') page.innerHTML = state.calView === 'import' ? renderImportView() : renderCalendarioTab();
    else if(state.tab === 'squadre') page.innerHTML = state.squadreView === 'import' ? renderSquadreImportView() : renderSquadreTab();
    else if(state.tab === 'schede') page.innerHTML = state.scheda.view === 'list' ? renderSchedeList() : renderSchedaForm();
    wireTabEvents();
    if(state.tab === 'calendario' && state.calView === 'list') scrollToCalendarioToday();
  }catch(err){
    // rete di sicurezza: se qualcosa va storto nel render, non lasciare l'app bloccata
    // sulla schermata precedente senza spiegazione. Torna a una vista sicura e avvisa.
    console.error('Errore di render:', err);
    try{
      state.scheda.view = 'list';
      const page = document.getElementById('page-content');
      if(page) page.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p><strong>Si è verificato un problema aprendo questa schermata.</strong></p><p>I tuoi dati salvati non sono stati toccati. Torna indietro e riprova; se il problema si ripete, dimmelo in chat.</p></div>`;
      wireTabEvents();
    }catch(e2){ /* niente altro da fare */ }
  }
}

function renderScoutArchivioTab(){
  const allArchived = state.matches.filter(m => m.daVedere && m.archiviata);

  if(allArchived.length === 0){
    return `<div class="empty-state">
      <div class="icon">📚</div>
      <p><strong>La libreria è vuota.</strong></p>
      <p>Le partite che archivi dalla prima pagina finiranno qui.</p>
    </div>`;
  }

  const chips = chipListFromMatches(allArchived);
  const list = allArchived.filter(m => matchesChip(m, state.archivioFilter.comp));

  let html = `
    <div class="pitch-hint" style="margin-bottom:10px;">📚 <strong>${allArchived.length}</strong> partite in libreria</div>
    <div class="chip-row" id="archivio-chips">
      ${chips.map(c => `<span class="chip ${state.archivioFilter.comp===c?'active':''}" data-comp="${escapeHtml(c)}">${escapeHtml(calChipLabel(c))}</span>`).join('')}
    </div>
  `;

  if(list.length === 0){
    html += `<div class="empty-state"><div class="icon">📚</div><p>Nessuna partita in questa categoria.</p></div>`;
    return html;
  }

  const shelves = {};
  list.forEach(m => {
    const base = parseGirone(m.girone).base;
    const key = (m.competizione || 'Senza categoria') + (base ? ' · '+base : '');
    if(!shelves[key]) shelves[key] = [];
    shelves[key].push(m);
  });
  Object.values(shelves).forEach(arr => {
    arr.sort((a,b) => (b.data+(b.ora||'')).localeCompare(a.data+(a.ora||'')));
  });

  html += Object.keys(shelves).sort().map(key => {
    const sample = shelves[key][0];
    const color = colorForKey((sample.competizione||'')+'|'+(parseGirone(sample.girone).base||''));
    return `
    <div class="section-label">📚 ${escapeHtml(key)} <span style="color:${color};">(${shelves[key].length})</span></div>
    ${shelves[key].map(m => `
      <div class="shelf-card" style="border-left:3px solid ${color};">
        <div class="match-head">
          <span class="match-date">${weekday(m.data)} ${fmtDate(m.data)}${m.ora ? ' · '+m.ora : ''}</span>
        </div>
        <div class="match-teams" style="font-size:14px;">${escapeHtml(m.casa)} <span class="vs">–</span> ${escapeHtml(m.ospite)}</div>
        ${m.obiettivoCasa ? `<div class="pitch-hint" style="margin-top:4px;">${escapeHtml(m.casa)}: ${escapeHtml(m.obiettivoCasa)}</div>` : ''}
        ${m.obiettivoOspite ? `<div class="pitch-hint" style="margin-top:2px;">${escapeHtml(m.ospite)}: ${escapeHtml(m.obiettivoOspite)}</div>` : ''}
        ${m.note ? `<div class="pitch-hint" style="margin-top:2px;">${escapeHtml(m.note)}</div>` : ''}
        <button class="btn btn-secondary" data-unarchive-id="${m.id}" style="width:100%;margin-top:8px;padding:6px;font-size:12px;">↩︎ Riporta tra le gare da vedere</button>
      </div>
    `).join('')}
  `;
  }).join('');
  return html;
}

/* ============ TAB: CALENDARIO GARE UFFICIALI ============ */
function parseGirone(g){
  if(!g) return { base: '', num: null };
  const m = g.match(/^(.*?)\s*-\s*G(\d+)\s*$/);
  if(m) return { base: m[1].trim(), num: parseInt(m[2],10) };
  return { base: g.trim(), num: null };
}
function gironeLabel(g){
  if(!g) return 'Calendario';
  const p = parseGirone(g);
  return p.num ? `${p.base} · Giornata ${p.num}` : p.base;
}
const CAL_PALETTE = ['#C4A052','#5C8FA8','#8B7CC7','#6B9B7C','#B25A4A','#C77C9E','#4FA8A0','#A8935C','#7C8FC7','#C77C5C','#5CA88F','#9B7CC7'];
function categoryColorMap(){
  const keys = new Set();
  state.matches.forEach(m => keys.add((m.competizione||'')+'|'+(parseGirone(m.girone).base||'')));
  const sorted = [...keys].sort();
  const map = {};
  sorted.forEach((k,i) => { map[k] = CAL_PALETTE[i % CAL_PALETTE.length]; });
  return map;
}
function colorForKey(key){
  return categoryColorMap()[key] || CAL_PALETTE[0];
}

function chipListFromMatches(matches){
  const map = {};
  matches.forEach(m => {
    const comp = m.competizione || '';
    if(!comp) return;
    if(!map[comp]) map[comp] = new Set();
    const base = parseGirone(m.girone).base;
    if(base) map[comp].add(base);
  });
  const chips = ['Tutte'];
  Object.keys(map).sort().forEach(comp => {
    const bases = [...map[comp]].sort();
    if(bases.length > 1){
      bases.forEach(b => chips.push(`${comp}|${b}`));
    } else {
      chips.push(comp);
    }
  });
  return chips;
}
function calChipList(){
  return chipListFromMatches(state.matches);
}
function calChipLabel(chip){
  if(chip === 'Tutte') return 'Tutte';
  if(chip.includes('|')){ const [c,b] = chip.split('|'); return `${c} · ${b}`; }
  return chip;
}
function matchesChip(m, chip){
  if(chip === 'Tutte') return true;
  if(chip.includes('|')){
    const [c,b] = chip.split('|');
    return m.competizione === c && parseGirone(m.girone).base === b;
  }
  return m.competizione === chip;
}

function renderCalendarioTab(){
  const chips = calChipList();
  const search = state.calFilter.search.toLowerCase();
  const isTutte = state.calFilter.comp === 'Tutte';
  let list = state.matches.filter(m => {
    if(!matchesChip(m, state.calFilter.comp)) return false;
    if(search && !(`${m.casa} ${m.ospite}`.toLowerCase().includes(search))) return false;
    return true;
  });

  if(isTutte){
    list.sort((a,b) => (a.data+(a.ora||'')).localeCompare(b.data+(b.ora||'')));
  } else {
    list.sort((a,b) => {
      const ga = parseGirone(a.girone), gb = parseGirone(b.girone);
      if(ga.base !== gb.base) return ga.base.localeCompare(gb.base);
      if((ga.num||0) !== (gb.num||0)) return (ga.num||0)-(gb.num||0);
      return (a.data+(a.ora||'')).localeCompare(b.data+(b.ora||''));
    });
  }

  let html = `
    <div class="search-bar">
      <input type="text" id="cal-search" placeholder="Cerca squadra..." value="${escapeHtml(state.calFilter.search)}">
    </div>
    <div class="chip-row" id="cal-chips">
      ${chips.map(c => `<span class="chip ${state.calFilter.comp===c?'active':''}" data-comp="${escapeHtml(c)}">${escapeHtml(calChipLabel(c))}</span>`).join('')}
    </div>
    ${!isTutte ? `<button class="btn btn-secondary" id="btn-delete-filtered" style="width:100%;margin-bottom:12px;">🗑 Elimina tutte le partite di "${escapeHtml(calChipLabel(state.calFilter.comp))}"</button>` : ''}
  `;

  if(list.length === 0){
    html += `<div class="empty-state"><div class="icon">📅</div><p>Nessuna gara trovata.</p></div>`;
    return html;
  }

  let lastSection = null;
  list.forEach(m => {
    const sectionKey = isTutte ? m.data : (m.girone||'');
    if(sectionKey !== lastSection){
      if(isTutte){
        html += `<div class="section-label cal-sticky">${weekday(m.data)} ${fmtDate(m.data)}</div>`;
      } else {
        const gp = parseGirone(m.girone);
        const secColor = colorForKey((m.competizione||'')+'|'+(gp.base||''));
        html += gp.num
          ? `<div class="giornata-title cal-sticky" style="color:${secColor};">${escapeHtml(gp.base)} <span class="giornata-num">Giornata ${gp.num}</span></div>`
          : `<div class="giornata-title cal-sticky" style="color:${secColor};">${escapeHtml(gironeLabel(m.girone))}</div>`;
      }
      lastSection = sectionKey;
    }
    const rowColor = isTutte ? colorForKey((m.competizione||'')+'|'+(parseGirone(m.girone).base||'')) : null;
    html += `
      <div class="cal-row ${m.daVedere?'is-selected':''}" data-date="${m.data}" ${rowColor ? `style="border-left:3px solid ${rowColor};padding-left:8px;"` : ''}>
        <div class="cal-row-info">
          <span class="cal-row-time">${isTutte ? (m.ora||'—') : (fmtDate(m.data)+(m.ora?' · '+m.ora:''))}</span>
          <span class="cal-row-teams">${escapeHtml(m.casa)} – ${escapeHtml(m.ospite)}</span>
          <span class="cal-row-comp" ${rowColor ? `style="color:${rowColor};"` : ''}>${escapeHtml(m.competizione||'')}${m.girone?' · '+escapeHtml(m.girone):''}</span>
        </div>
        <div class="cal-row-actions">
          <button class="toggle-btn ${m.daVedere?'on':''}" data-toggle-id="${m.id}">${m.daVedere?'Sì':'No'}</button>
          <button class="del-btn" data-delete-id="${m.id}" aria-label="Elimina">🗑</button>
        </div>

const MONTHS_IT = {
  gen:1, gennaio:1, feb:2, febbraio:2, mar:3, marzo:3, apr:4, aprile:4,
  mag:5, maggio:5, giu:6, giugno:6, lug:7, luglio:7, ago:8, agosto:8,
  set:9, settembre:9, ott:10, ottobre:10, nov:11, novembre:11, dic:12, dicembre:12
};
function normalizeMonth(str){
  const s = str.toLowerCase().replace(/[^a-zàèìòù]/g,'');
  for(const key in MONTHS_IT){ if(s.startsWith(key)) return MONTHS_IT[key]; }
  return null;
}
function pad2(n){ return String(n).padStart(2,'0'); }

function parseCalendarText(text, defaultStartYear){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  let currentDate = null;
  let currentComp = null;
  let currentGirone = null;
  const results = [];

  const reDateSlash = /^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/;
  const reDateDash = /^(\d{1,2})-(\d{1,2})-(\d{2,4})$/;
  const reDateText = /^(?:[A-Za-zàèìòù]+\s+)?(\d{1,2})\s+([A-Za-zàèìòù]+)\.?\s*(\d{4})?$/i;
  const reSectionHeader = /^#+\s*(.+?)\s*\|\s*(.+)$/;

  lines.forEach(line => {
    if(/giornata/i.test(line) && !line.startsWith('#')) return;

    let m;
    if((m = line.match(reSectionHeader))){
      currentComp = m[1].trim();
      currentGirone = m[2].trim();
      currentDate = null;
      return;
    }
    if((m = line.match(reDateSlash)) || (m = line.match(reDateDash))){
      const dd = m[1], mm = m[2];
      let y = parseInt(m[3],10); if(y<100) y += 2000;
      currentDate = `${y}-${pad2(mm)}-${pad2(dd)}`;
      return;
    }
    if((m = line.match(reDateText))){
      const dd = parseInt(m[1],10);
      const mon = normalizeMonth(m[2]);
      if(mon){
        const y = m[3] ? parseInt(m[3],10) : (mon>=7 ? defaultStartYear : defaultStartYear+1);
        currentDate = `${y}-${pad2(mon)}-${pad2(dd)}`;
        return;
      }
    }
    if(/[-–]/.test(line) && currentDate){
      const timeMatch = line.match(/(\d{1,2})[:.](\d{2})/);
      const ora = timeMatch ? `${pad2(timeMatch[1])}:${timeMatch[2]}` : null;
      const cleanLine = timeMatch ? line.replace(timeMatch[0],'').trim() : line;
      const parts = cleanLine.split(/\s*[-–]\s*/);
      if(parts.length>=2){
        const casa = parts[0].replace(/^[•\-\d.)]+\s*/,'').trim();
        const ospite = parts.slice(1).join(' - ').trim();
        if(casa && ospite){
          results.push({ data: currentDate, ora, casa, ospite, competizione: currentComp, girone: currentGirone });
        }
      }
    }
  });
  return results;
}

let tesseractLoading = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => resolve();
    s.onerror = () => { tesseractLoading = null; reject(new Error('Impossibile caricare il lettore di testo')); };
    document.head.appendChild(s);
  });
  return tesseractLoading;
}

function rootCategoria(cat){
  const m = cat.match(/^(.*?)\s*-\s*Girone\s/i);
  return m ? m[1].trim() : cat;
}

function findTeamForMatch(name, competizione, gironeBase){
  const nameL = name.toLowerCase();
  let t = state.teams.find(x => x.squadra.toLowerCase()===nameL &&
    rootCategoria(x.categoria).toLowerCase()===(competizione||'').toLowerCase() &&
    (!gironeBase || x.categoria.toLowerCase().includes(gironeBase.toLowerCase())));
  if(t) return t;
  t = state.teams.find(x => x.squadra.toLowerCase()===nameL &&
    rootCategoria(x.categoria).toLowerCase()===(competizione||'').toLowerCase());
  if(t) return t;
  return state.teams.find(x => x.squadra.toLowerCase()===nameL);
}

function applyMatchToSquadreCounter(m){
  if(m.contatoSquadre) return false;
  const field = m.modalita === 'Diretta' ? 'volteDiretta' : m.modalita === 'Video' ? 'volteVideo' : null;
  if(!field) return false;
  const gironeBase = parseGirone(m.girone).base;
  let touched = false;
  [m.casa, m.ospite].forEach(name => {
    const t = findTeamForMatch(name, m.competizione, gironeBase);
    if(t){ t[field] = (t[field]||0) + 1; touched = true; }
  });
  if(touched){ m.contatoSquadre = true; saveTeams(state.teams); }
  return touched;
}

function gironeLetterFromCategoria(cat){
  const m = cat.match(/Girone\s+([A-Za-z0-9]+)/i);
  return m ? m[1] : null;
}

function ratingSummary(sheet){
  const all = Object.values(sheet.ratings||{});
  const filled = all.filter(Boolean);
  if(filled.length===0) return null;
  const v = filled.filter(x=>x==='V').length;
  const eq = filled.filter(x=>x==='=').length;
  const x = filled.filter(x=>x==='X').length;
  return {v,eq,x,total:filled.length};
}

/* ============ EVENT WIRING ============ */
function wireTabEvents(){
  if(state.tab === 'scout'){
    if(state.scoutView === 'archivio') wireScoutArchivioEvents();
    else wireScoutEvents();
  }
  else if(state.tab === 'calendario'){
    if(state.calView === 'import') wireImportEvents();
    else wireCalendarioEvents();
  }
  else if(state.tab === 'squadre'){
    if(state.squadreView === 'import') wireSquadreImportEvents();
    else wireSquadreEvents();
  }
  else if(state.tab === 'schede'){
    if(state.scheda.view === 'list') wireSchedeListEvents();
    else wireSchedaFormEvents();
  }
}

function wireScoutEvents(){
  document.querySelectorAll('[data-match-id]').forEach(el => {
    el.addEventListener('change', () => {
      const m = state.matches.find(x=>x.id===el.dataset.matchId);
      if(m){ m[el.dataset.field] = el.value; saveMatches(state.matches); }
    });
  });
  document.querySelectorAll('[data-vista-match-id]').forEach(chip => {
    chip.addEventListener('click', () => {
      const m = state.matches.find(x=>x.id===chip.dataset.vistaMatchId);
      if(m){
        m.modalita = m.modalita === chip.dataset.vistaVal ? '' : chip.dataset.vistaVal;
        saveMatches(state.matches);
        document.getElementById('page-content').innerHTML = renderScoutTab();
        wireScoutEvents();
      }
    });
  });
  document.querySelectorAll('[data-archive-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = state.matches.find(x=>x.id===btn.dataset.archiveId);
      if(m){
        m.archiviata = true;
        const counted = applyMatchToSquadreCounter(m);
        saveMatches(state.matches);
        document.getElementById('page-content').innerHTML = renderScoutTab();
        wireScoutEvents();
        toast(counted ? 'Archiviata — contatore Squadre aggiornato' : 'Partita archiviata nella libreria');
      }
    });
  });
  document.querySelectorAll('[data-ics-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = state.matches.find(x=>x.id===btn.dataset.icsId);
      if(m){
        window.open(gcalEventUrl(m), '_blank');
      }
    });
  });
  const btnAll = document.getElementById('btn-export-all-ics');
  if(btnAll){
    btnAll.addEventListener('click', () => {
      const list = state.matches.filter(m => m.daVedere && !m.archiviata);
      if(list.length === 0) return;
      downloadICS('partite-da-vedere.ics', buildICS(list));
      toast(`${list.length} partite scaricate — se il file non si apre, usa "📅 Calendario" su ogni singola partita`);
    });
  }
}

function wireCalendarioEvents(){
  const search = document.getElementById('cal-search');
  if(search){
    search.addEventListener('input', () => {
      state.calFilter.search = search.value;
      const page = document.getElementById('page-content');
      page.innerHTML = renderCalendarioTab();
      wireCalendarioEvents();
      document.getElementById('cal-search').focus();
      document.getElementById('cal-search').setSelectionRange(search.value.length, search.value.length);
    });
  }
  document.querySelectorAll('#cal-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      state.calFilter.comp = chip.dataset.comp;
      document.getElementById('page-content').innerHTML = renderCalendarioTab();
      wireCalendarioEvents();
      scrollToCalendarioToday();
    });
  });
  const delFiltered = document.getElementById('btn-delete-filtered');
  if(delFiltered){
    delFiltered.addEventListener('click', () => {
      const label = calChipLabel(state.calFilter.comp);
      const toRemove = state.matches.filter(m => matchesChip(m, state.calFilter.comp) &&
        (!state.calFilter.search || `${m.casa} ${m.ospite}`.toLowerCase().includes(state.calFilter.search.toLowerCase())));
      if(toRemove.length === 0) return;
      showConfirm(`Eliminare tutte le ${toRemove.length} partite di "${label}"?`, () => {
        const removeIds = new Set(toRemove.map(m=>m.id));
        state.matches = state.matches.filter(m => !removeIds.has(m.id));
        saveMatches(state.matches);
        state.calFilter.comp = 'Tutte';
        document.getElementById('page-content').innerHTML = renderCalendarioTab();
        wireCalendarioEvents();
        toast(`${toRemove.length} partite eliminate`);
      });
    });
  }
  document.querySelectorAll('[data-toggle-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = state.matches.find(x=>x.id===btn.dataset.toggleId);
      if(m){
        m.daVedere = !m.daVedere;
        saveMatches(state.matches);
        document.getElementById('page-content').innerHTML = renderCalendarioTab();
        wireCalendarioEvents();
        toast(m.daVedere ? 'Aggiunta a "Da vedere"' : 'Rimossa da "Da vedere"');
      }
    });
  });
  document.querySelectorAll('[data-delete-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = state.matches.find(x=>x.id===btn.dataset.deleteId);
      if(!m) return;
      showConfirm(`Eliminare ${m.casa} - ${m.ospite}?`, () => {
        state.matches = state.matches.filter(x=>x.id!==m.id);
        saveMatches(state.matches);
        document.getElementById('page-content').innerHTML = renderCalendarioTab();
        wireCalendarioEvents();
        toast('Partita eliminata');
      });
    });
  });
}

function wireImportEvents(){
  const d = state.importDraft;
  const bind = (id, prop) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', () => { d[prop] = el.value; });
  };
  bind('imp-comp','competizione');
  bind('imp-girone','girone');
  bind('imp-text','text');
  const annoEl = document.getElementById('imp-anno');
  if(annoEl) annoEl.addEventListener('input', () => { d.anno = parseInt(annoEl.value,10) || d.anno; });

  const photoInput = document.getElementById('imp-photo');
  if(photoInput) photoInput.addEventListener('change', async () => {
    const file = photoInput.files[0];
    if(!file) return;
    const label = document.getElementById('imp-photo-label');
    if(label) label.textContent = 'Lettura in corso...';
    toast('Sto leggendo la foto...');
    try{
      await loadTesseract();
      const result = await Tesseract.recognize(file, 'ita');
      const recognized = (result && result.data && result.data.text) ? result.data.text.trim() : '';
      d.text = d.text ? (d.text + '\n' + recognized) : recognized;
      const ta = document.getElementById('imp-text');
      if(ta) ta.value = d.text;
      toast(recognized ? 'Testo riconosciuto: controlla e correggi' : 'Non ho riconosciuto testo nella foto');
    }catch(err){
      toast('Non sono riuscito a leggere la foto');
    }
    if(label) label.textContent = '\ud83d\udcf7 Scegli foto / scatta';
    photoInput.value = '';
  });

  const btn = document.getElementById('btn-do-import');
  if(btn) btn.addEventListener('click', () => {
    if(!d.text.trim()){ toast('Incolla il testo del calendario'); document.getElementById('imp-text').focus(); return; }
    const parsed = parseCalendarText(d.text, d.anno);
    if(parsed.length === 0){ toast('Nessuna partita riconosciuta'); return; }
    const hasNoContext = parsed.some(p => !p.competizione) && !d.competizione.trim();
    if(hasNoContext){ toast('Inserisci la competizione, oppure aggiungi intestazioni "## Competizione | Girone" nel testo'); document.getElementById('imp-comp').focus(); return; }
    let added = 0, updated = 0;
    parsed.forEach(p => {
      const comp = (p.competizione || d.competizione.trim());
      const girone = (p.girone || d.girone.trim() || null);
      const existing = state.matches.find(m =>
        (m.competizione||'').toLowerCase()===comp.toLowerCase() &&
        m.casa.toLowerCase()===p.casa.toLowerCase() &&
        m.ospite.toLowerCase()===p.ospite.toLowerCase()
      );
      if(existing){
        if(existing.data !== p.data || existing.ora !== p.ora || existing.girone !== girone){
          existing.data = p.data;
          existing.ora = p.ora;
          existing.girone = girone;
          updated++;
        }
      } else {
        state.matches.push({
          id: uid(), data: p.data, ora: p.ora, competizione: comp,
          girone: girone, casa: p.casa, ospite: p.ospite,
          stadio: null, daVedere: false, obiettivo: '', note: ''
        });
        added++;
      }
    });
    saveMatches(state.matches);
    toast(`${added} nuove, ${updated} aggiornate (su ${parsed.length} trovate)`);
    d.text = '';
    state.calView = 'list';
    render();
  });
}

function wireSquadreEvents(){
  document.querySelectorAll('#squadre-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      state.squadreFilter.comp = chip.dataset.comp;
      state.squadreFilter.girone = 'Tutte';
      document.getElementById('page-content').innerHTML = renderSquadreTab();
      wireSquadreEvents();
    });
  });
  document.querySelectorAll('#squadre-girone-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      state.squadreFilter.girone = chip.dataset.girone;
      document.getElementById('page-content').innerHTML = renderSquadreTab();
      wireSquadreEvents();
    });
  });
  document.querySelectorAll('[data-rename-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      const oldCat = btn.dataset.renameCat;
      const newCat = prompt(`Rinomina categoria:`, oldCat);
      if(!newCat || !newCat.trim() || newCat.trim() === oldCat) return;
      const newCatTrim = newCat.trim();
      const existingNames = new Set(state.teams.filter(t=>t.categoria===newCatTrim).map(t=>t.squadra.toLowerCase()));
      let merged = 0;
      state.teams.forEach(t => {
        if(t.categoria === oldCat){
          if(existingNames.has(t.squadra.toLowerCase())){
            t._remove = true;
            merged++;
          } else {
            t.categoria = newCatTrim;
          }
        }
      });
      if(merged>0) state.teams = state.teams.filter(t=>!t._remove);
      saveTeams(state.teams);
      state.squadreFilter.comp = 'Tutte';
      state.squadreFilter.girone = 'Tutte';
      document.getElementById('page-content').innerHTML = renderSquadreTab();
      wireSquadreEvents();
      toast(`Categoria rinominata in "${newCatTrim}"${merged>0 ? ` (${merged} doppioni rimossi)` : ''}`);
    });
  });
  document.querySelectorAll('[data-delete-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.dataset.deleteCat;
      const count = state.teams.filter(t=>t.categoria===cat).length;
      showConfirm(`Eliminare tutte le ${count} squadre di "${cat}"?`, () => {
        state.teams = state.teams.filter(t=>t.categoria!==cat);
        saveTeams(state.teams);
        state.squadreFilter.comp = 'Tutte';
        state.squadreFilter.girone = 'Tutte';
        document.getElementById('page-content').innerHTML = renderSquadreTab();
        wireSquadreEvents();
        toast(`Categoria "${cat}" svuotata`);
      });
    });
  });
  document.querySelectorAll('[data-counter-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = state.teams.find(x=>x.id===btn.dataset.counterId);
      const field = btn.dataset.counterType;
      if(t && field){
        t[field] = Math.max(0, (t[field]||0) + parseInt(btn.dataset.delta,10));
        saveTeams(state.teams);
        document.getElementById('page-content').innerHTML = renderSquadreTab();
        wireSquadreEvents();
      }
    });
  });
}

function wireSchedaFormEvents(){
  const d = state.scheda.draft;
  const bind = (id, prop, sub) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', () => {
      if(sub) d[sub][prop] = el.value; else d[prop] = el.value;
    });
    el.addEventListener('change', () => {
      if(sub) d[sub][prop] = el.value; else d[prop] = el.value;
    });
  };
  bind('f-giocatore','giocatore');
  bind('f-squadra','squadra');
  bind('f-ruolo','ruolo');
  bind('f-piede','piede');
  bind('f-valore-mercato','valoreMercato');
  bind('f-altezza','altezza');
  bind('f-struttura','struttura');
  bind('f-data','data');
  bind('f-partita','partita');
  bind('f-data-partita','dataPartita');
  bind('f-minuti','minuti');
  bind('f-osservazioni','osservazioni');
  bind('f-link-documento','linkDocumento');
  bind('f-team1-nome','nome','team1');
  bind('f-team1-modulo','modulo','team1');
  bind('f-team2-nome','nome','team2');
  bind('f-team2-modulo','modulo','team2');

  wirePhotoGridEvents();
  const photoInput = document.getElementById('f-photo-input');
  if(photoInput) photoInput.addEventListener('change', async () => {
    const files = Array.from(photoInput.files || []);
    if(files.length === 0) return;
    const label = document.getElementById('f-photo-label');
    let assets = null;
    if(window.claude && typeof window.claude.use === 'function'){
      try{ assets = await window.claude.use('assets'); }catch(e){ assets = null; }
    }
    if(!assets){
      // fuori da Claude (sito indipendente): salva la foto direttamente come base64,
      // così la funzione continua a funzionare senza uno spazio di archiviazione esterno.
      assets = {
        upload: async (file) => ({ id: uid(), url: await blobToBase64(file) })
      };
    }
    if(label) label.textContent = 'Caricamento in corso...';
    let ok = 0, fail = 0;
    for(const file of files){
      try{
        const res = await assets.upload(file);
        state.scheda.draft.immagini.push({ id: res.id, url: res.url });
        persistDraftSheet();
        refreshPhotoGrid();
        ok++;
      }catch(err){
        fail++;
      }
    }
    if(label) label.textContent = '📷 Aggiungi foto';
    photoInput.value = '';
    if(ok && !fail) toast(ok===1 ? 'Foto caricata' : `${ok} foto caricate`);
    else if(ok && fail) toast(`${ok} caricate, ${fail} non riuscite`);
    else toast('Non sono riuscito a caricare le foto');
  });

  document.querySelectorAll('.rating-toggle').forEach(group => {
    group.querySelectorAll('.rt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const attr = group.dataset.attr;
        const val = btn.dataset.val;
        d.ratings[attr] = d.ratings[attr] === val ? undefined : val;
        group.querySelectorAll('.rt-btn').forEach(b => b.classList.toggle('active', d.ratings[attr]===b.dataset.val));
      });
    });
  });

  const pt1 = document.getElementById('pt-team1');
  const pt2 = document.getElementById('pt-team2');
  if(pt1) pt1.addEventListener('click', () => { state.scheda.pitchTeam = 1; pt1.classList.add('active'); pt2.classList.remove('active'); });
  if(pt2) pt2.addEventListener('click', () => { state.scheda.pitchTeam = 2; pt2.classList.add('active'); pt1.classList.remove('active'); });

  const pmPlayer = document.getElementById('pm-player');
  const pmArrow = document.getElementById('pm-arrow');
  const resetArrowMode = () => { state.scheda.pendingArrow = null; };
  if(pmPlayer) pmPlayer.addEventListener('click', () => { state.scheda.pitchMode='player'; resetArrowMode(); pmPlayer.classList.add('active'); pmArrow.classList.remove('active'); });
  if(pmArrow) pmArrow.addEventListener('click', () => { state.scheda.pitchMode='arrow'; resetArrowMode(); pmArrow.classList.add('active'); pmPlayer.classList.remove('active'); });

  const clearBtn = document.getElementById('pitch-clear');
  if(clearBtn) clearBtn.addEventListener('click', () => {
    d.pitch.markers = []; d.pitch.arrows = []; state.scheda.pendingArrow = null;
    refreshPitch();
  });

  wirePitchSvg();

  const saveBtn = document.getElementById('save-sheet');
  saveBtn.addEventListener('click', () => {
    if(!d.giocatore.trim()){ toast('Inserisci il nome del giocatore'); document.getElementById('f-giocatore').focus(); return; }
    const idx = state.sheets.findIndex(s=>s.id===d.id);
    if(idx>=0) state.sheets[idx] = d; else state.sheets.push(d);
    saveSheets(state.sheets);
    toast('Scheda salvata');
    state.scheda.view = 'list';
    render();
  });

  const exportBtn = document.getElementById('export-sheet-doc');
  if(exportBtn) exportBtn.addEventListener('click', exportSchedaAsDoc);

  const delBtn = document.getElementById('delete-sheet');
  if(delBtn) delBtn.addEventListener('click', () => {
    showConfirm('Eliminare questa scheda?', () => {
      state.sheets = state.sheets.filter(s=>s.id!==state.scheda.editingId);
      saveSheets(state.sheets);
      toast('Scheda eliminata');
      state.scheda.view = 'list';
      render();
    });
  });
}

/* ============ EXPORT SCHEDA (condivisione testo per Google Documenti) ============ */
function buildSchedaText(d){
  const lines = [];
  lines.push(`SCHEDA SCOUTING — ${d.giocatore || '—'}`);
  lines.push(`Squadra: ${d.squadra||'—'}   Ruolo: ${d.ruolo||'—'}   Piede: ${d.piede||'—'}`);
  lines.push(`Data di nascita: ${d.data||'—'}   Valore di mercato: ${d.valoreMercato||'—'}   Minuti osservati: ${d.minuti||'—'}`);
  lines.push(`Altezza: ${d.altezza ? d.altezza+' cm' : '—'}   Struttura: ${d.struttura||'—'}`);
  lines.push(`Partita: ${d.partita||'—'}   Data partita: ${d.dataPartita||'—'}`);
  lines.push('');
  lines.push('VALUTAZIONE (X scarso · = nella media · V valido)');
  Object.entries(RATING_GROUPS).forEach(([group, attrs]) => {
    lines.push(`${group}:`);
    attrs.forEach(attr => { lines.push(`  - ${attr}: ${d.ratings[attr] || '—'}`); });
  });
  lines.push('');
  lines.push(`Formazione ${d.team1.nome || 'Team 1'} (modulo ${d.team1.modulo || '—'})`);
  lines.push(`Formazione ${d.team2.nome || 'Team 2'} (modulo ${d.team2.modulo || '—'})`);
  lines.push('');
  lines.push('OSSERVAZIONI');
  lines.push(d.osservazioni || '—');
  return lines.join('\n');
}
/* ---- minimal in-browser .docx (OOXML/ZIP) builder, no external deps ---- */
function crc32Bytes(buf){
  if(!crc32Bytes.table){
    const table = [];
    for(let n=0;n<256;n++){
      let c = n;
      for(let k=0;k<8;k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
      table[n] = c >>> 0;
    }
    crc32Bytes.table = table;
  }
  let crc = 0 ^ (-1);
  for(let i=0;i<buf.length;i++){ crc = (crc >>> 8) ^ crc32Bytes.table[(crc ^ buf[i]) & 0xFF]; }
  return (crc ^ (-1)) >>> 0;
}
function strToUtf8Bytes(str){ return new TextEncoder().encode(str); }
function buildZipStored(files){
  const localParts = [], centralParts = [];
  let offset = 0;
  const dosTime = 0, dosDate = 0x21;
  files.forEach(f => {
    const nameBytes = strToUtf8Bytes(f.name);
    const data = f.data;
    const crc = crc32Bytes(data);
    const size = data.length;
    const local = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, dosTime, true);
    dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, size, true);
    dv.setUint32(22, size, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    localParts.push(local, data);

    const central = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(central.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, dosTime, true);
    cdv.setUint16(14, dosDate, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true);
    cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centralParts.push(central);

    offset += local.length + data.length;
  });
  const centralSize = centralParts.reduce((s,p)=>s+p.length,0);
  const centralOffset = offset;
  const end = new Uint8Array(22);
  const edv = new DataView(end.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, centralOffset, true);
  edv.setUint16(20, 0, true);
  const allParts = [...localParts, ...centralParts, end];
  const totalLen = allParts.reduce((s,p)=>s+p.length,0);
  const result = new Uint8Array(totalLen);
  let pos = 0;
  allParts.forEach(p => { result.set(p, pos); pos += p.length; });
  return result;
}
function buildStandalonePitchSvg(d){
  const cs = getComputedStyle(document.documentElement);
  const team1 = (cs.getPropertyValue('--team1')||'').trim() || '#E8CE8A';
  const team2 = (cs.getPropertyValue('--team2')||'').trim() || '#8FB0D6';
  const LINE = '#3C5548';
  const line = (svg) => svg; // no-op, kept for readability
  const arrows = (d.pitch.arrows||[]).map(a => `<line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" stroke="${a.team===1?team1:team2}" stroke-width="0.6" marker-end="url(#arrowhead-${a.team})"/>`).join('');
  const markers = (d.pitch.markers||[]).map(m => `
    <circle cx="${m.x}" cy="${m.y}" r="2.6" fill="${m.team===1?team1:team2}" stroke="#0F1512" stroke-width="0.3"/>
    <text x="${m.x}" y="${m.y+1}" text-anchor="middle" font-size="2.6" fill="#0F1512" font-family="Arial, sans-serif" font-weight="600">${escapeHtml(m.label||'')}</text>
  `).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 105" width="400" height="618">
    <defs>
      <marker id="arrowhead-1" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${team1}"/></marker>
      <marker id="arrowhead-2" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${team2}"/></marker>
    </defs>
    <rect x="0" y="0" width="68" height="105" fill="#16241C"/>
    <rect x="1" y="1" width="66" height="103" stroke="${LINE}" stroke-width="0.3" fill="none"/>
    <line x1="1" y1="52.5" x2="67" y2="52.5" stroke="${LINE}" stroke-width="0.3"/>
    <circle cx="34" cy="52.5" r="9.15" stroke="${LINE}" stroke-width="0.3" fill="none"/>
    <circle cx="34" cy="52.5" r="0.4" stroke="${LINE}" stroke-width="0.3" fill="none"/>
    <rect x="13.84" y="1" width="40.32" height="16.5" stroke="${LINE}" stroke-width="0.3" fill="none"/>
    <rect x="24.84" y="1" width="18.32" height="5.5" stroke="${LINE}" stroke-width="0.3" fill="none"/>
    <rect x="13.84" y="87.5" width="40.32" height="16.5" stroke="${LINE}" stroke-width="0.3" fill="none"/>
    <rect x="24.84" y="98.5" width="18.32" height="5.5" stroke="${LINE}" stroke-width="0.3" fill="none"/>
    <circle cx="34" cy="12.5" r="0.4" stroke="${LINE}" stroke-width="0.3" fill="none"/>
    <circle cx="34" cy="92.5" r="0.4" stroke="${LINE}" stroke-width="0.3" fill="none"/>
    ${arrows}
    ${markers}
  </svg>`;
}
function svgStringToPngBytes(svgString, pxWidth, pxHeight){
  return new Promise((resolve, reject) => {
    try{
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        try{
          const canvas = document.createElement('canvas');
          canvas.width = pxWidth; canvas.height = pxHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, pxWidth, pxHeight);
          URL.revokeObjectURL(url);
          canvas.toBlob(blob => {
            if(!blob){ reject(new Error('toBlob failed')); return; }
            blob.arrayBuffer().then(buf => resolve(new Uint8Array(buf))).catch(reject);
          }, 'image/png');
        }catch(e){ URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    }catch(e){ reject(e); }
  });
}
function buildDocxBlob(title, topText, bottomText, image){
  const textParagraphs = (str) => str.split('\n').map(line => {
    const esc = escapeHtml(line);
    return `<w:p><w:r><w:t xml:space="preserve">${esc}</w:t></w:r></w:p>`;
  }).join('');
  let imageDrawing = '';
  const files = [];
  let contentTypesImageEntry = '';
  let relsEntry = '';
  if(image && image.bytes && image.bytes.length){
    const cx = 3657600; // 4 inches, EMU
    const cy = Math.round(cx * (image.h / image.w));
    imageDrawing = `<w:p><w:r><w:t xml:space="preserve">Schieramento tattico:</w:t></w:r></w:p><w:p><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="1" name="Campo"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="0" name="Campo"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdImg1"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
    files.push({ name: 'word/media/image1.png', data: image.bytes });
    contentTypesImageEntry = '<Default Extension="png" ContentType="image/png"/>';
    relsEntry = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdImg1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image1.png"/></Relationships>`;
    files.push({ name: 'word/_rels/document.xml.rels', data: strToUtf8Bytes(relsEntry) });
  }
  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${textParagraphs(topText)}${imageDrawing}${textParagraphs(bottomText)}<w:sectPr/></w:body></w:document>`;
  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>${contentTypesImageEntry}<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  files.push(
    { name: '[Content_Types].xml', data: strToUtf8Bytes(contentTypes) },
    { name: '_rels/.rels', data: strToUtf8Bytes(rels) },
    { name: 'word/document.xml', data: strToUtf8Bytes(documentXml) }
  );
  const zipBytes = buildZipStored(files);
  return new Blob([zipBytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}
async function exportSchedaAsDoc(){
  const d = state.scheda.draft;
  const fullText = buildSchedaText(d);
  const splitAt = fullText.indexOf('OSSERVAZIONI');
  const topText = splitAt >= 0 ? fullText.slice(0, splitAt).replace(/\n+$/,'') : fullText;
  const bottomText = splitAt >= 0 ? fullText.slice(splitAt) : '';
  const title = `Scheda — ${d.giocatore || 'Giocatore'}`;
  const safeName = (d.giocatore || 'Giocatore').replace(/[\\/:*?"<>|]/g, '-').trim() || 'Giocatore';

  let image = null;
  const hasPitchContent = (d.pitch && ((d.pitch.markers||[]).length || (d.pitch.arrows||[]).length));
  if(hasPitchContent){
    try{
      const svgString = buildStandalonePitchSvg(d);
      const w = 400, h = 618;
      const bytes = await svgStringToPngBytes(svgString, w, h);
      image = { bytes, w, h };
    }catch(e){ image = null; }
  }

  let downloads = null;
  try{
    downloads = window.claude ? await window.claude.use('downloads') : null;
  }catch(e){ downloads = null; }
  if(downloads){
    try{
      const blob = buildDocxBlob(title, topText, bottomText, image);
      await downloads.save({ filename: `Scheda ${safeName}.docx`, data: blob });
      toast('Scheda esportata in Word');
      return;
    }catch(err){
      if(err && err.code === 'declined') return;
      // qualsiasi altro errore: fallback al testo copiabile
    }
  }
  showExportText(title, fullText);
}
function showExportText(title, text){
  const overlay = getModalOverlay();
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:420px;">
      <p class="modal-message">${escapeHtml(title)}<br><span style="font-size:12px;color:var(--text-dim);">Seleziona e copia il testo, poi incollalo in un Documento Google o Word.</span></p>
      <textarea id="modal-export-text" class="modal-input" style="height:220px;resize:vertical;font-family:monospace;font-size:12px;" readonly>${escapeHtml(text)}</textarea>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">Chiudi</button>
        <button class="btn btn-primary" id="modal-copy">Copia testo</button>
      </div>
    </div>
  `;
  overlay.classList.add('show');
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
  const ta = document.getElementById('modal-export-text');
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-copy').onclick = () => {
    ta.focus(); ta.select();
    let copied = false;
    try{ copied = document.execCommand('copy'); }catch(e){ copied = false; }
    if(copied){ toast('Testo copiato'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text)
        .then(() => toast('Testo copiato'))
        .catch(() => toast('Copia non riuscita: seleziona il testo a mano e copialo'));
    } else {
      toast('Copia non riuscita: seleziona il testo a mano e copialo');
    }
  };
}

function refreshPitch(){
  const d = state.scheda.draft;
  document.getElementById('pitch-arrows').innerHTML = d.pitch.arrows.map((a,i) =>
    `<line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" class="pitch-arrow" stroke="${a.team===1?'var(--team1)':'var(--team2)'}" marker-end="url(#arrowhead-${a.team})" data-arrow-idx="${i}"/>`
  ).join('');
  document.getElementById('pitch-markers').innerHTML = d.pitch.markers.map((m,i) => `
    <circle cx="${m.x}" cy="${m.y}" r="2.6" class="pitch-marker" fill="${m.team===1?'var(--team1)':'var(--team2)'}" data-marker-idx="${i}"/>
    <text x="${m.x}" y="${m.y+1}" class="pitch-marker-label" text-anchor="middle" font-size="2.6" data-marker-idx="${i}">${m.label}</text>
  `).join('');
  wirePitchSvg();
}

function wirePitchSvg(){
  const svg = document.getElementById('pitch-svg');
  if(!svg) return;
  const d = state.scheda.draft;

  svg.querySelectorAll('[data-marker-idx]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = parseInt(el.dataset.markerIdx,10);
      const cur = d.pitch.markers[i];
      showPrompt('Numero maglia (lascia vuoto per rimuovere il giocatore):', cur.label, (val) => {
        const trimmed = val.trim();
        if(trimmed === ''){
          d.pitch.markers.splice(i,1);
        } else {
          cur.label = trimmed.slice(0,2);
        }
        refreshPitch();
      });
    });
  });
  svg.querySelectorAll('[data-arrow-idx]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = parseInt(el.dataset.arrowIdx,10);
      d.pitch.arrows.splice(i,1);
      refreshPitch();
    });
  });

  svg.onclick = (e) => {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    const x = Math.max(1, Math.min(67, loc.x));
    const y = Math.max(1, Math.min(104, loc.y));

    if(state.scheda.pitchMode === 'player'){
      const team = state.scheda.pitchTeam;
      const countSameTeam = d.pitch.markers.filter(m=>m.team===team).length;
      showPrompt('Numero maglia del giocatore:', String(countSameTeam+1), (val) => {
        const trimmed = val.trim();
        const label = trimmed === '' ? String(countSameTeam+1) : trimmed.slice(0,2);
        d.pitch.markers.push({ x, y, team, label });
        refreshPitch();
      });
    } else {
      if(!state.scheda.pendingArrow){
        state.scheda.pendingArrow = { x, y };
        toast('Tocca il punto di arrivo della freccia');
      } else {
        d.pitch.arrows.push({ x1: state.scheda.pendingArrow.x, y1: state.scheda.pendingArrow.y, x2:x, y2:y, team: state.scheda.pitchTeam });
        state.scheda.pendingArrow = null;
        refreshPitch();
      }
    }
  };
}

applyTheme(localStorage.getItem(LS.theme) || 'glicine');
render();

/* exposed for debugging in devtools console */
window.state = state;
window.render = render;
window.openNewSheet = openNewSheet;
window.refreshPitch = refreshPitch;

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
