<style>
:root{
  --bg:#4A4172;
  --surface:#564C82;
  --surface-2:#605584;
  --surface-3:#6C6092;
  --line:#6E62A0;
  --text:#FCFAFF;
  --text-dim:#DCD1F2;
  --text-faint:#C1AEE0;
  --gold:#E8CE8A;
  --gold-dim:#B89F5C;
  --gold-text:#1A1408;
  --green:#E0A868;
  --red:#D97A6A;
  --neutral:#C9BEE8;
  --team1:#E8CE8A;
  --team2:#8FB0D6;
  --radius:6px;
  --radius-sm:4px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  overflow:hidden;
  position:fixed;
  inset:0;
}
#app{
  display:flex;
  flex-direction:column;
  height:100%;
  width:100%;
}
.topbar{
  padding:14px 18px 12px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  flex-shrink:0;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  position:relative;
}
.app-cover{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:calc(10px + var(--safe-top)) 18px 0;
  background:var(--surface);
  flex-shrink:0;
}
.app-cover img{
  max-width:220px;
  width:100%;
  height:auto;
  border-radius:10px;
}
.topbar h1{
  font-family:'Source Serif 4',Georgia,serif;
  font-weight:600;
  font-size:21px;
  letter-spacing:0.01em;
  margin:0;
  color:var(--text);
}
.topbar .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--gold);
  letter-spacing:0.08em;
  text-transform:uppercase;
}
.topbar-sub{display:flex;flex-direction:column;gap:2px;}
.topbar-action{
  background:var(--gold);
  color:var(--gold-text);
  border:none;
  border-radius:var(--radius-sm);
  padding:9px 14px;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:13px;
  white-space:nowrap;
}
.topbar-theme-btn{
  background:var(--surface-2);
  border:1px solid var(--line);
  padding:7px 10px;
  font-size:16px;
  line-height:1;
}
.topbar-actions-group{display:flex;align-items:center;gap:8px;}
.theme-picker{
  position:absolute;
  top:100%;
  right:18px;
  margin-top:6px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:10px;
  display:flex;
  gap:10px;
  z-index:30;
}
.theme-swatch{
  width:32px;
  height:32px;
  border-radius:50%;
  border:2px solid var(--line);
  padding:0;
  flex-shrink:0;
}
main{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:14px 14px calc(14px + var(--safe-bottom));
}
nav.bottomnav{
  display:flex;
  background:var(--surface);
  border-top:1px solid var(--line);
  flex-shrink:0;
  padding-bottom:var(--safe-bottom);
}
nav.bottomnav button{
  flex:1;
  background:none;
  border:none;
  color:var(--text-faint);
  padding:9px 4px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-family:'Inter',sans-serif;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:0.02em;
  text-transform:uppercase;
}
nav.bottomnav button .icon{font-size:20px;line-height:1;}
nav.bottomnav button.active{color:var(--gold);}
nav.bottomnav button.active .icon{filter:drop-shadow(0 0 6px rgba(196,160,82,0.35));}

/* generic components */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:10px;
}
.card:active{background:var(--surface-2);}
.shelf-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:9px 10px;
  margin-bottom:7px;
}
.shelf-card .match-date{font-size:10.5px;}
.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--text-faint);
}
.empty-state .icon{font-size:36px;margin-bottom:10px;opacity:0.6;}
.empty-state p{font-size:14px;line-height:1.5;margin:4px 0;}

.search-bar{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.search-bar input{
  flex:1;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  color:var(--text);
  font-size:14px;
  font-family:'Inter',sans-serif;
}
.search-bar input:focus{outline:none;border-color:var(--gold-dim);}

.chip-row{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:2px;
  margin-bottom:12px;
  -ms-overflow-style:none;
  scrollbar-width:none;
}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--text-dim);
  border-radius:100px;
  padding:6px 13px;
  font-size:12.5px;
  font-weight:500;
  white-space:nowrap;
}
.chip.active{background:var(--gold);border-color:var(--gold);color:var(--gold-text);font-weight:600;}

.section-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--text-faint);
  margin:18px 0 8px 2px;
}
.section-label:first-child{margin-top:0;}
.cat-rename-btn{
  background:transparent;
  border:none;
  font-size:13px;
  padding:2px 6px;
  flex-shrink:0;
  opacity:0.75;
}
.giornata-title{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:19px;
  font-weight:600;
  letter-spacing:0.01em;
  margin:20px 0 10px 2px;
  padding-bottom:6px;
  border-bottom:3px double var(--line);
}
.giornata-title:first-child{margin-top:0;}
.schede-cat-title{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--text-dim);
  margin:24px 0 6px 2px;
  padding-bottom:8px;
  border-bottom:3px double var(--line);
}
.schede-cat-title:first-child{margin-top:0;}
.schede-team-title{
  font-family:'Inter',sans-serif;
  font-size:11.5px;
  font-weight:600;
  color:var(--gold);
  text-transform:uppercase;
  letter-spacing:0.04em;
  margin:14px 0 8px 2px;
  display:flex;
  align-items:center;
  gap:6px;
}
.schede-team-count{
  font-family:'IBM Plex Mono',monospace;
  font-weight:500;
  font-size:10.5px;
  color:var(--text-faint);
  background:var(--surface-2);
  border-radius:100px;
  padding:1px 7px;
  text-transform:none;
  letter-spacing:normal;
}
.giornata-num{
  font-size:21px;
  font-weight:700;
}
.cal-sticky{
  position:sticky;
  top:0;
  z-index:5;
  background:var(--bg);
}
.section-label.cal-sticky{padding:6px 0 8px 2px;margin-top:0;}
.giornata-title.cal-sticky{padding-top:6px;}

input, select, textarea{
  font-family:'Inter',sans-serif;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  color:var(--text);
  padding:10px 12px;
  font-size:14px;
  width:100%;
}
input:focus, select:focus, textarea:focus{outline:none;border-color:var(--gold-dim);}
label{
  display:block;
  font-size:11.5px;
  color:var(--text-faint);
  margin-bottom:5px;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:0.03em;
}
.field{margin-bottom:12px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}

.btn{
  border:none;
  border-radius:var(--radius-sm);
  padding:12px 16px;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:14px;
  width:100%;
  text-align:center;
}
.btn-primary{background:var(--gold);color:var(--gold-text);}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);}
.btn-sm{padding:8px 12px;font-size:13px;width:auto;}

::-webkit-scrollbar{width:0;height:0;}

.toast{
  position:fixed;
  bottom:calc(78px + var(--safe-bottom));
  left:50%;
  transform:translateX(-50%);
  background:var(--surface-3);
  border:1px solid var(--line);
  color:var(--text);
  padding:10px 18px;
  border-radius:100px;
  font-size:13px;
  font-weight:500;
  z-index:999;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.2s, transform 0.2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:340px;width:100%;}
.modal-message{color:var(--text);margin:0 0 16px;font-size:15px;line-height:1.4;}
.modal-input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:15px;margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;}

/* --- scout / calendario card --- */
.match-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
  margin-bottom:6px;
}
.match-date{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--gold);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.02em;
}
.match-comp{font-size:11px;color:var(--text-faint);text-align:right;}
.match-teams{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:18px;
  font-weight:600;
  letter-spacing:0.01em;
}
.match-teams .vs{color:var(--text-faint);font-weight:400;padding:0 2px;}

.cal-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 4px;
  border-bottom:1px solid var(--line);
}
.cal-row.is-selected{background:rgba(196,160,82,0.06);}
.cal-row-info{display:flex;flex-direction:column;gap:2px;min-width:0;}
.cal-row-time{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--text-faint);
}
.cal-row-teams{
  font-size:14.5px;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cal-row-comp{font-size:11px;color:var(--text-faint);}
.cal-row-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.del-btn{
  flex-shrink:0;
  border:none;
  background:transparent;
  color:var(--text-faint);
  font-size:15px;
  padding:6px 4px;
  line-height:1;
}
.toggle-btn{
  flex-shrink:0;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--text-dim);
  border-radius:100px;
  padding:7px 14px;
  font-size:12.5px;
  font-weight:600;
  font-family:'Inter',sans-serif;
}
.toggle-btn.on{background:var(--gold);border-color:var(--gold);color:var(--gold-text);}

/* --- squadre --- */
.team-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 2px;
  border-bottom:1px solid var(--line);
}
.team-row-name{font-size:14.5px;font-weight:500;flex:1;min-width:0;}
.team-row-controls{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.counter-group{display:flex;flex-direction:column;align-items:center;gap:2px;}
.counter-label{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.03em;}
.vista-chips{display:flex;gap:4px;}
.vista-chip{padding:5px 10px;font-size:11.5px;}
.counter{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:100px;
  padding:3px 4px;
}
.counter button{
  width:24px;height:24px;
  border-radius:50%;
  border:none;
  background:var(--surface-3);
  color:var(--text);
  font-size:15px;
  line-height:1;
  font-weight:600;
}
.counter-tag{width:24px;height:24px;border-radius:50%;box-sizing:border-box;font-size:12px;font-weight:700;line-height:21px;text-align:center;font-family:'Inter',sans-serif;}
.counter-tag.p{background:var(--gold);color:var(--gold-text);border:1.5px solid var(--gold);}
.counter-tag.v{background:transparent;color:var(--gold);border:1.5px solid var(--gold);}
.counter span{font-family:'IBM Plex Mono',monospace;font-size:13px;min-width:16px;text-align:center;}
.team-row.has-views .team-row-name{color:var(--green);font-weight:600;}

/* --- riepilogo grande (Tutte) --- */
.big-stat{text-align:center;padding:20px 12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:6px 0 14px;}
.big-num{font-family:'Source Serif 4',Georgia,serif;font-size:76px;font-weight:700;line-height:1;color:var(--gold);}
.big-num small{font-size:36px;font-weight:600;}
.big-sub{margin-top:8px;font-size:13px;color:var(--text-dim);}
.big-split{display:flex;justify-content:center;gap:10px;margin-top:12px;}
.big-split span{font-size:12.5px;font-weight:600;padding:4px 12px;border-radius:100px;border:1.5px solid var(--gold);color:var(--gold);}
.big-split span.p{background:var(--gold);color:var(--gold-text);}
.pct-row{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 2px;color:var(--text);font-family:'Inter',sans-serif;cursor:pointer;}
.pct-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:600;}
.pct-head b{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--gold);}
.pct-bar{height:7px;border-radius:100px;background:var(--surface-3);margin-top:6px;overflow:hidden;}
.pct-bar i{display:block;height:100%;background:var(--gold);border-radius:100px;}
.pct-meta{font-size:11.5px;color:var(--text-faint);margin-top:3px;}

/* --- schede list --- */
.sheet-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.sheet-card-name{font-family:'Source Serif 4',Georgia,serif;font-size:18px;font-weight:600;}
.sheet-card-meta{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
.sheet-card-date{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--gold);
  flex-shrink:0;
}
.rating-bar{
  display:flex;
  height:5px;
  border-radius:100px;
  overflow:hidden;
  margin-top:12px;
  background:var(--surface-3);
}
.seg-v{background:var(--green);}
.seg-eq{background:var(--neutral);}
.seg-x{background:var(--red);}
.rating-legend{font-size:11px;color:var(--text-faint);margin-top:6px;}
.sheet-doc-link{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:4px 10px;}
.sheet-doc-link:active{opacity:0.7;}
.photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.photo-thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .photo-remove{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;border:none;font-size:12px;line-height:20px;text-align:center;padding:0;cursor:pointer;}
.photo-thumb .photo-uploading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.4);color:#fff;font-size:11px;text-align:center;padding:4px;}

/* --- scheda form --- */
.rating-group{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:4px 14px;
  margin-bottom:10px;
}
.rating-group-title{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--gold);
  padding:10px 0 6px;
}
.rating-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-top:1px solid var(--line);
}
.rating-row:first-of-type{border-top:none;}
.rating-label{font-size:13.5px;color:var(--text);}
.rating-toggle{display:flex;gap:5px;}
.rt-btn{
  width:28px;height:28px;
  border-radius:50%;
  border:1.5px solid var(--line);
  background:var(--surface-2);
  color:var(--text-faint);
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:13px;
}
.rt-btn.active.rt-v{background:var(--green);border-color:var(--green);color:#0F1512;}
.rt-btn.active.rt-eq{background:var(--neutral);border-color:var(--neutral);color:#0F1512;}
.rt-btn.active.rt-x{background:var(--red);border-color:var(--red);color:#0F1512;}

.pitch-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.pitch-team-toggle, .pitch-mode-toggle{display:flex;gap:6px;}
.pt-btn, .pm-btn{
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--text-dim);
  border-radius:100px;
  padding:7px 12px;
  font-size:12px;
  font-weight:600;
}
.pt-btn{color:var(--dot-color);border-color:var(--line);}
.pt-btn.active{background:var(--surface-3);border-color:currentColor;}
.pm-btn.active{background:var(--gold);border-color:var(--gold);color:var(--gold-text);}

.pitch-wrap{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:10px;
}
#pitch-svg{
  width:72%;
  max-width:300px;
  height:auto;
  aspect-ratio:68/105;
  border-radius:8px;
  touch-action:manipulation;
  display:block;
  margin:0 auto;
}
.pitch-turf{fill:#16241C;}
.pitch-line-el{stroke:#3C5548;stroke-width:0.3;fill:none;}
.pitch-marker{stroke:#0F1512;stroke-width:0.3;}
.pitch-marker-label{fill:#0F1512;font-family:'IBM Plex Mono',monospace;font-weight:600;pointer-events:none;}
.pitch-arrow{stroke-width:0.6;}
.pitch-hint{
  font-size:11px;
  color:var(--text-faint);
  text-align:center;
  margin-top:8px;
}
</style>

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function exportBackup(){
  const sheets = JSON.parse(JSON.stringify(JSON.parse(localStorage.getItem(LS.sheets) || '[]')));
  // incorpora le foto come base64 nel backup, così il file resta completo e leggibile
  // anche fuori da Claude (es. su un sito indipendente) o su un altro dispositivo.
  for(const s of sheets){
    if(Array.isArray(s.immagini)){
      for(const img of s.immagini){
        if(img && img.url && !img.dataBase64){
          try{
            const resp = await fetch(img.url);
            const blob = await resp.blob();
            img.dataBase64 = await blobToBase64(blob);
          }catch(e){ /* se il download della foto fallisce, resta solo il riferimento originale */ }
        }
      }
    }
  }
  const data = {
    v: 2,
    exportedAt: new Date().toISOString(),
    matches: JSON.parse(localStorage.getItem(LS.matches) || '[]'),
    teams: JSON.parse(localStorage.getItem(LS.teams) || '[]'),
    sheets,
    theme: localStorage.getItem(LS.theme) || 'referto'
  };
  const jsonStr = JSON.stringify(data, null, 2);
  const stamp = new Date().toISOString().slice(0,10);
  const filename = `scouting-backup-${stamp}.json`;

  let downloads = null;
  try{ downloads = window.claude ? await window.claude.use('downloads') : null; }catch(e){ downloads = null; }
  if(downloads){
    try{
      const blob = new Blob([jsonStr], { type: 'application/json' });
      await downloads.save({ filename, data: blob });
      toast('Backup esportato');
      return;
    }catch(err){
      if(err && err.code === 'declined') return;
      // qualsiasi altro errore: prova il download nativo del browser sotto
    }
  }
  try{
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('Backup esportato');
  }catch(e){
    showExportText('Backup dati (JSON)', jsonStr);
  }
}

/* ============ DOPPIONI: riconoscimento per contenuto ============ */
// Partite e squadre ricevono un id casuale diverso su ogni dispositivo, quindi
// l'id da solo non basta: due elementi sono "lo stesso" se ne coincide il contenuto.
function _n(v){ return String(v == null ? '' : v).trim().toLowerCase(); }
function matchKey(m){ return [_n(m.competizione), _n(m.casa), _n(m.ospite), _n(m.data)].join('|'); }
function teamKey(t){ return [_n(t.categoria), _n(t.squadra)].join('|'); }
function sheetKey(s){
  // tutto il contenuto della scheda tranne id e foto: si uniscono solo copie identiche
  const c = Object.assign({}, s); delete c.id; delete c.immagini;
  const sortObj = o => (o && typeof o === 'object' && !Array.isArray(o))
    ? Object.keys(o).sort().reduce((r,k)=>{ r[k]=sortObj(o[k]); return r; }, {})
    : (Array.isArray(o) ? o.map(sortObj) : o);
  return JSON.stringify(sortObj(c));
}
function _fillEmpty(target, other){
  Object.keys(other).forEach(k => {
    if(k === 'id') return;
    const tv = target[k], ov = other[k];
    if(tv === undefined || tv === null || tv === '') target[k] = ov;
  });
}
function combineMatch(a, b){
  const r = Object.assign({}, a);
  _fillEmpty(r, b);
  ['daVedere','archiviata','contatoSquadre'].forEach(k => { if(a[k] || b[k]) r[k] = true; });
  return r;
}
function combineTeam(a, b){
  const r = Object.assign({}, a);
  _fillEmpty(r, b);
  ['volteViste','volteDiretta','volteVideo'].forEach(k => {
    r[k] = Math.max(Number(a[k])||0, Number(b[k])||0);
  });
  return r;
}
function combineSheet(a, b){
  const ia = Array.isArray(a.immagini) ? a.immagini.length : 0;
  const ib = Array.isArray(b.immagini) ? b.immagini.length : 0;
  return ib > ia ? Object.assign({}, a, { immagini: b.immagini }) : a;
}
function dedupeBy(arr, keyFn, combine){
  const out = []; const pos = new Map();
  (arr || []).forEach(item => {
    if(!item) return;
    const k = keyFn(item);
    if(pos.has(k)){ const i = pos.get(k); out[i] = combine(out[i], item); }
    else { pos.set(k, out.length); out.push(item); }
  });
  return out;
}
function cleanDuplicatesOnce(){
  const m = JSON.parse(localStorage.getItem(LS.matches) || '[]');
  const t = JSON.parse(localStorage.getItem(LS.teams) || '[]');
  const s = JSON.parse(localStorage.getItem(LS.sheets) || '[]');
  const m2 = dedupeBy(m, matchKey, combineMatch);
  const t2 = dedupeBy(t, teamKey, combineTeam);
  const s2 = dedupeBy(s, sheetKey, combineSheet);
  const removed = (m.length-m2.length) + (t.length-t2.length) + (s.length-s2.length);
  if(m2.length !== m.length) localStorage.setItem(LS.matches, JSON.stringify(m2));
  if(t2.length !== t.length) localStorage.setItem(LS.teams, JSON.stringify(t2));
  if(s2.length !== s.length) localStorage.setItem(LS.sheets, JSON.stringify(s2));
  return { partite: m.length-m2.length, squadre: t.length-t2.length, schede: s.length-s2.length, totale: removed };
}

// Unisce due elenchi: un elemento del file viene aggiunto solo se non esiste già qui
// né con lo stesso id né con lo stesso contenuto. Se esiste, i due vengono fusi.
function mergeByKey(localArr, importedArr, keyFn, combine){
  const ids = new Set(localArr.map(x => x && x.id));
  const fresh = (importedArr || []).filter(x => x && !(x.id && ids.has(x.id)));
  return dedupeBy(localArr.concat(fresh), keyFn, combine);
}
function importBackupFile(file, mode){
  mode = mode === 'replace' ? 'replace' : 'merge';
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.matches) || !Array.isArray(data.teams) || !Array.isArray(data.sheets)){
        toast('File di backup non valido');
        return;
      }
      // se le foto sono state salvate come base64 nel backup, usale direttamente come
      // immagine: funzionano ovunque, senza dipendere dallo storage foto originale.
      const importedSheets = data.sheets.map(s => {
        if(Array.isArray(s.immagini)){
          s = Object.assign({}, s, {
            immagini: s.immagini.map(img => (img && img.dataBase64) ? Object.assign({}, img, { url: img.dataBase64 }) : img)
          });
        }
        return s;
      });

      let finalMatches, finalTeams, finalSheets;
      if(mode === 'replace'){
        finalMatches = dedupeBy(data.matches, matchKey, combineMatch);
        finalTeams = dedupeBy(data.teams, teamKey, combineTeam);
        finalSheets = dedupeBy(importedSheets, sheetKey, combineSheet);
      } else {
        const localMatches = JSON.parse(localStorage.getItem(LS.matches) || '[]');
        const localTeams = JSON.parse(localStorage.getItem(LS.teams) || '[]');
        const localSheets = JSON.parse(localStorage.getItem(LS.sheets) || '[]');
        finalMatches = mergeByKey(localMatches, data.matches, matchKey, combineMatch);
        finalTeams = mergeByKey(localTeams, data.teams, teamKey, combineTeam);
        finalSheets = mergeByKey(localSheets, importedSheets, sheetKey, combineSheet);
      }

      localStorage.setItem(LS.matches, JSON.stringify(finalMatches));
      localStorage.setItem(LS.teams, JSON.stringify(finalTeams));
      try{
        localStorage.setItem(LS.sheets, JSON.stringify(finalSheets));
      }catch(quotaErr){
        // spazio esaurito per via delle foto in base64: riprova senza, avvisando l'utente
        const sheetsNoPhotos = finalSheets.map(s => Object.assign({}, s, { immagini: [] }));
        localStorage.setItem(LS.sheets, JSON.stringify(sheetsNoPhotos));
        toast('Backup importato, ma le foto erano troppo pesanti per lo spazio disponibile e non sono state importate');
      }
      if(mode === 'replace' && data.theme) localStorage.setItem(LS.theme, data.theme);
      toast(mode === 'replace' ? 'Backup ripristinato, ricarico...' : 'Backup unito, ricarico...');
      setTimeout(()=>location.reload(), 700);
    }catch(e){
      toast('Errore nella lettura del backup');
    }
  };
  reader.readAsText(file);
}

/* ============ EXPORT CALENDARIO (.ics) ============ */
function icsEscape(str){
  return String(str||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function icsDateTime(dataStr, oraStr){
  const [y,m,d] = dataStr.split('-');
  const time = oraStr ? oraStr.replace(':','') + '00' : '150000';
  return `${y}${m}${d}T${time}`;
}
function buildICS(matches){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Scouting App//IT'];
  matches.forEach(m => {
    const dtStart = icsDateTime(m.data, m.ora);
    let endTime;
    if(m.ora){
      let [hh,mm] = m.ora.split(':').map(Number);
      hh = (hh+2) % 24;
      endTime = `${String(hh).padStart(2,'0')}${String(mm).padStart(2,'0')}00`;
    } else {
      endTime = '170000';
    }
    const dtEnd = dtStart.slice(0,8) + 'T' + endTime;
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${m.id}@scouting-app`);
    lines.push(`DTSTART:${dtStart}`);
    lines.push(`DTEND:${dtEnd}`);
    lines.push(`SUMMARY:${icsEscape(m.casa + ' - ' + m.ospite)}`);
    lines.push(`DESCRIPTION:${icsEscape((m.competizione||'') + (m.girone?' · '+m.girone:''))}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadICS(filename, content){
  const blob = new Blob([content], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function gcalEventUrl(m){
  const start = icsDateTime(m.data, m.ora);
  let endTime;
  if(m.ora){
    let [hh,mm] = m.ora.split(':').map(Number);
    hh = (hh+2) % 24;
    endTime = `${String(hh).padStart(2,'0')}${String(mm).padStart(2,'0')}00`;
  } else {
    endTime = '170000';
  }
  const end = start.slice(0,8) + 'T' + endTime;
  const text = encodeURIComponent(`${m.casa} - ${m.ospite}`);
  const details = encodeURIComponent((m.competizione||'') + (m.girone ? ' · '+m.girone : ''));
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${start}/${end}&details=${details}`;
}

function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  const mesi = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  return `${d} ${mesi[parseInt(m,10)-1]}`;
}
function weekday(iso){
  if(!iso) return '';
  const days = ['dom','lun','mar','mer','gio','ven','sab'];
  return days[new Date(iso+'T12:00:00').getDay()];
}
function toast(msg){

}
function getModalOverlay(){

function showPrompt(message, defaultValue, onSubmit){

  input.addEventListener('keydown', e => { if(e.key==='Enter') submit(); });

function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  const rows = document.querySelectorAll('#page-content .cal-row[data-date]');
  if(!rows.length) return;
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  let target = null;
  rows.forEach(r => { if(!target && r.dataset.date >= todayStr) target = r; });
  if(!target) target = rows[rows.length-1];
  target.scrollIntoView({block:'start'});
}

/* ============ TAB: CALENDARIO GARE UFFICIALI ============ */
function parseGirone(g){
  if(!g) return { base: '', num: null };
  const m = g.match(/^(.*?)\s*-\s*G(\d+)\s*$/);
  if(m) return { base: m[1].trim(), num: parseInt(m[2],10) };
  return { base: g.trim(), num: null };
}
function gironeLabel(g){
  if(!g) return 'Calendario';
  const p = parseGirone(g);
  return p.num ? `${p.base} · Giornata ${p.num}` : p.base;
}
const CAL_PALETTE = ['#C4A052','#5C8FA8','#8B7CC7','#6B9B7C','#B25A4A','#C77C9E','#4FA8A0','#A8935C','#7C8FC7','#C77C5C','#5CA88F','#9B7CC7'];
function categoryColorMap(){
  const keys = new Set();
  state.matches.forEach(m => keys.add((m.competizione||'')+'|'+(parseGirone(m.girone).base||'')));
  const sorted = [...keys].sort();
  const map = {};
  sorted.forEach((k,i) => { map[k] = CAL_PALETTE[i % CAL_PALETTE.length]; });
  return map;
}
function colorForKey(key){
  return categoryColorMap()[key] || CAL_PALETTE[0];
}

function chipListFromMatches(matches){
  const map = {};
  matches.forEach(m => {
    const comp = m.competizione || '';
    if(!comp) return;
    if(!map[comp]) map[comp] = new Set();
    const base = parseGirone(m.girone).base;
    if(base) map[comp].add(base);
  });
  const chips = ['Tutte'];
  Object.keys(map).sort().forEach(comp => {
    const bases = [...map[comp]].sort();
    if(bases.length > 1){
      bases.forEach(b => chips.push(`${comp}|${b}`));
    } else {
      chips.push(comp);
    }
  });
  return chips;
}
function calChipList(){
  return chipListFromMatches(state.matches);
}
function calChipLabel(chip){
  if(chip === 'Tutte') return 'Tutte';
  if(chip.includes('|')){ const [c,b] = chip.split('|'); return `${c} · ${b}`; }
  return chip;
}
function matchesChip(m, chip){
  if(chip === 'Tutte') return true;
  if(chip.includes('|')){
    const [c,b] = chip.split('|');
    return m.competizione === c && parseGirone(m.girone).base === b;
  }
  return m.competizione === chip;
}

const MONTHS_IT = {
  gen:1, gennaio:1, feb:2, febbraio:2, mar:3, marzo:3, apr:4, aprile:4,
  mag:5, maggio:5, giu:6, giugno:6, lug:7, luglio:7, ago:8, agosto:8,
  set:9, settembre:9, ott:10, ottobre:10, nov:11, novembre:11, dic:12, dicembre:12
};
function normalizeMonth(str){
  const s = str.toLowerCase().replace(/[^a-zàèìòù]/g,'');
  for(const key in MONTHS_IT){ if(s.startsWith(key)) return MONTHS_IT[key]; }
  return null;
}
function pad2(n){ return String(n).padStart(2,'0'); }

function parseCalendarText(text, defaultStartYear){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  let currentDate = null;
  let currentComp = null;
  let currentGirone = null;
  const results = [];

  const reDateSlash = /^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/;
  const reDateDash = /^(\d{1,2})-(\d{1,2})-(\d{2,4})$/;
  const reDateText = /^(?:[A-Za-zàèìòù]+\s+)?(\d{1,2})\s+([A-Za-zàèìòù]+)\.?\s*(\d{4})?$/i;
  const reSectionHeader = /^#+\s*(.+?)\s*\|\s*(.+)$/;

  lines.forEach(line => {
    if(/giornata/i.test(line) && !line.startsWith('#')) return;

    let m;
    if((m = line.match(reSectionHeader))){
      currentComp = m[1].trim();
      currentGirone = m[2].trim();
      currentDate = null;
      return;
    }
    if((m = line.match(reDateSlash)) || (m = line.match(reDateDash))){
      const dd = m[1], mm = m[2];
      let y = parseInt(m[3],10); if(y<100) y += 2000;
      currentDate = `${y}-${pad2(mm)}-${pad2(dd)}`;
      return;
    }
    if((m = line.match(reDateText))){
      const dd = parseInt(m[1],10);
      const mon = normalizeMonth(m[2]);
      if(mon){
        const y = m[3] ? parseInt(m[3],10) : (mon>=7 ? defaultStartYear : defaultStartYear+1);
        currentDate = `${y}-${pad2(mon)}-${pad2(dd)}`;
        return;
      }
    }
    if(/[-–]/.test(line) && currentDate){
      const timeMatch = line.match(/(\d{1,2})[:.](\d{2})/);
      const ora = timeMatch ? `${pad2(timeMatch[1])}:${timeMatch[2]}` : null;
      const cleanLine = timeMatch ? line.replace(timeMatch[0],'').trim() : line;
      const parts = cleanLine.split(/\s*[-–]\s*/);
      if(parts.length>=2){
        const casa = parts[0].replace(/^[•\-\d.)]+\s*/,'').trim();
        const ospite = parts.slice(1).join(' - ').trim();
        if(casa && ospite){
          results.push({ data: currentDate, ora, casa, ospite, competizione: currentComp, girone: currentGirone });
        }
      }
    }
  });
  return results;
}

let tesseractLoading = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => resolve();
    s.onerror = () => { tesseractLoading = null; reject(new Error('Impossibile caricare il lettore di testo')); };
    document.head.appendChild(s);
  });
  return tesseractLoading;
}

/* ============ TAB: SQUADRE ============ */
function rootCategoria(cat){
  const m = cat.match(/^(.*?)\s*-\s*Girone\s/i);
  return m ? m[1].trim() : cat;
}

function findTeamByName(name){
  const nameL = (name||'').toLowerCase().trim();
  if(!nameL) return null;
  let t = state.teams.find(x => x.squadra.toLowerCase().trim()===nameL);
  if(t) return t;
  // stesso criterio di findTeamForMatch: abbina solo se una stringa contiene per
  // intero l'altra e c'è un'unica squadra compatibile (es. "Rovato" / "Rovato Calcio").
  const candidates = state.teams.filter(x => {
    const tn = x.squadra.toLowerCase().trim();
    return tn.length>=3 && nameL.length>=3 && (tn.includes(nameL) || nameL.includes(tn));
  });
  return candidates.length === 1 ? candidates[0] : null;
}
// Deduce la categoria di una scheda dal nome squadra scritto sulla scheda, cercandolo
// tra le squadre già censite in "Squadre" — così le schede si archiviano per categoria
// senza dover ridigitare a mano un campo in più.
function deriveCategoriaFromSquadra(squadraName){
  const t = findTeamByName(squadraName);
  return t ? t.categoria : '';
}
// Compila la categoria mancante sulle schede già salvate, quando il nome squadra scritto
// combacia con una squadra censita — non tocca mai una categoria già presente.
function backfillSchedeCategoria(){
  let changed = false;
  state.sheets.forEach(s => {
    if(!s.categoria || !String(s.categoria).trim()){
      const cat = deriveCategoriaFromSquadra(s.squadra);
      if(cat){ s.categoria = cat; changed = true; }
    }
  });
  if(changed) saveSheets(state.sheets);
}

function findTeamForMatch(name, competizione, gironeBase){
  const nameL = name.toLowerCase().trim();
  let t = state.teams.find(x => x.squadra.toLowerCase()===nameL &&
    rootCategoria(x.categoria).toLowerCase()===(competizione||'').toLowerCase() &&
    (!gironeBase || x.categoria.toLowerCase().includes(gironeBase.toLowerCase())));
  if(t) return t;
  t = state.teams.find(x => x.squadra.toLowerCase()===nameL &&
    rootCategoria(x.categoria).toLowerCase()===(competizione||'').toLowerCase());
  if(t) return t;
  t = state.teams.find(x => x.squadra.toLowerCase()===nameL);
  if(t) return t;
  // nome non identico: es. nel calendario "Rovato" e nelle squadre "Rovato Calcio" (o viceversa).
  // Abbina solo se una delle due stringhe contiene per intero l'altra, e solo se c'è
  // un'unica squadra compatibile — altrimenti meglio non contare nulla che sbagliare squadra.
  const sameComp = state.teams.filter(x => rootCategoria(x.categoria).toLowerCase()===(competizione||'').toLowerCase());
  const pool = sameComp.length ? sameComp : state.teams;
  const candidates = pool.filter(x => {
    const tn = x.squadra.toLowerCase().trim();
    return tn.length>=3 && nameL.length>=3 && (tn.includes(nameL) || nameL.includes(tn));
  });
  return candidates.length === 1 ? candidates[0] : null;
}

function applyMatchToSquadreCounter(m){
  if(m.contatoSquadre) return false;
  const field = m.modalita === 'Diretta' ? 'volteDiretta' : m.modalita === 'Video' ? 'volteVideo' : null;
  if(!field) return false;
  const gironeBase = parseGirone(m.girone).base;
  let touched = false;
  [m.casa, m.ospite].forEach(name => {
    const t = findTeamForMatch(name, m.competizione, gironeBase);
    if(t){ t[field] = (t[field]||0) + 1; touched = true; }
  });
  if(touched){ m.contatoSquadre = true; saveTeams(state.teams); }
  return touched;
}
/* toglie dal contatore Squadre quanto una partita aveva aggiunto, usata quando una
   partita già "contata" viene eliminata (es. ripulendo dei doppioni) — senza questo
   i contatori Diretta/Video restano più alti di quante partite esistono davvero. */
function revertMatchToSquadreCounter(m){
  if(!m.contatoSquadre) return false;
  const field = m.modalita === 'Diretta' ? 'volteDiretta' : m.modalita === 'Video' ? 'volteVideo' : null;
  if(!field) return false;
  const gironeBase = parseGirone(m.girone).base;
  let touched = false;
  [m.casa, m.ospite].forEach(name => {
    const t = findTeamForMatch(name, m.competizione, gironeBase);
    if(t){ t[field] = Math.max(0, (t[field]||0) - 1); touched = true; }
  });
  if(touched) saveTeams(state.teams);
  return touched;
}
/* ricalcola da zero i contatori Diretta/Video di tutte le squadre partendo dalle
   partite salvate — corregge lo scarto che si crea quando una partita già "contata"
   viene eliminata (es. ripulendo dei doppioni) senza passare da revertMatchToSquadreCounter */
function recalcAllSquadreCounters(){
  state.teams.forEach(t => { t.volteDiretta = 0; t.volteVideo = 0; });
  state.matches.forEach(m => { m.contatoSquadre = false; });
  state.matches.forEach(m => applyMatchToSquadreCounter(m));
  saveTeams(state.teams);
  saveMatches(state.matches);
}
/* trova le partite segnate come viste (Diretta/Video) che coinvolgono una data squadra,
   usando la stessa logica di abbinamento nome+competizione già usata per i contatori */
function findMatchesForTeam(team){
  return state.matches.filter(m => {
    if(m.modalita !== 'Diretta' && m.modalita !== 'Video') return false;
    const gironeBase = parseGirone(m.girone).base;
    const tCasa = findTeamForMatch(m.casa, m.competizione, gironeBase);
    const tOspite = findTeamForMatch(m.ospite, m.competizione, gironeBase);
    return (tCasa && tCasa.id === team.id) || (tOspite && tOspite.id === team.id);
  }).sort((a,b) => (a.data||'').localeCompare(b.data||''));
}
function showTeamMatchesModal(team){
  const matches = findMatchesForTeam(team);
  const overlay = getModalOverlay();
  const rows = matches.length ? matches.map(m => {
    const isCasa = m.casa.toLowerCase() === team.squadra.toLowerCase();

function gironeLetterFromCategoria(cat){
  const m = cat.match(/Girone\s+([A-Za-z0-9]+)/i);
  return m ? m[1] : null;
}

function renderSquadreTab(){
  const cats = [...new Set(state.teams.map(t=>t.categoria))];
  const chips = ['Tutte', ...new Set(cats.map(rootCategoria))];
  const catsForComp = state.squadreFilter.comp === 'Tutte'
    ? cats

  const gironiForComp = [...new Set(catsForComp.map(gironeLetterFromCategoria).filter(Boolean))].sort();

  const visibleTeams = state.teams.filter(t => activeCats.includes(t.categoria));

  if(state.squadreFilter.comp === 'Tutte'){
    const pctOf = (a,b) => b ? Math.round(a*100/b) : 0;
    const totVisits = totDiretta + totVideo;
    html += `
      <div class="big-stat">
        <div class="big-num">${pctOf(totViste, visibleTeams.length)}<small>%</small></div>

  }
  activeCats.forEach(cat => {
    const catTeams = state.teams.filter(t=>t.categoria===cat);
    const catDiretta = catTeams.reduce((s,t)=>s+(t.volteDiretta||0),0);

    const catViste = catTeams.filter(t=>(t.volteDiretta>0||t.volteVideo>0)).length;
    html += `<div class="section-label" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <span>${escapeHtml(cat)} <span style="text-transform:none;">— P: ${catDiretta} · V: ${catVideo} · ${catViste}/${catTeams.length} viste</span></span>
      <span style="display:flex;gap:4px;flex-shrink:0;">
        <button class="cat-rename-btn" data-rename-cat="${escapeHtml(cat)}" aria-label="Rinomina categoria">✏️</button>

    catTeams.forEach(t => {

        <div class="team-row ${(t.volteDiretta>0||t.volteVideo>0)?'has-views':''}">

function wireSquadreImportEvents(){
  const d = state.squadreDraft;
  const bind = (id, prop) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', () => { d[prop] = el.value; });
  };
  bind('imp-sq-cat','categoria');
  bind('imp-sq-text','text');

  const btn = document.getElementById('btn-do-import-squadre');
  if(btn) btn.addEventListener('click', () => {
    if(!d.categoria.trim()){ toast('Inserisci la categoria'); document.getElementById('imp-sq-cat').focus(); return; }
    const names = d.text.split('\n').map(l=>l.trim()).filter(Boolean);
    if(names.length === 0){ toast('Inserisci almeno una squadra'); return; }
    let added = 0;
    names.forEach(name => {
      const exists = state.teams.some(t => t.categoria.toLowerCase()===d.categoria.trim().toLowerCase() && t.squadra.toLowerCase()===name.toLowerCase());
      if(!exists){
        state.teams.push({ id: uid(), categoria: d.categoria.trim(), squadra: name, volteDiretta: 0, volteVideo: 0 });
        added++;
      }
    });
    saveTeams(state.teams);
    toast(`${added} squadre aggiunte su ${names.length}`);
    d.text = '';
    state.squadreView = 'list';
    render();
  });
}

function ratingSummary(sheet){
  const all = Object.values(sheet.ratings||{});
  const filled = all.filter(Boolean);
  if(filled.length===0) return null;
  const v = filled.filter(x=>x==='V').length;
  const eq = filled.filter(x=>x==='=').length;
  const x = filled.filter(x=>x==='X').length;
  return {v,eq,x,total:filled.length};
}

function renderSheetCard(s){
  const sum = ratingSummary(s);
  return `
    <div class="card sheet-card" data-open-sheet="${s.id}">
      <div class="sheet-card-top">

          <div class="sheet-card-name">${escapeHtml(s.giocatore || 'Senza nome')}</div>

        </div>
        <div class="sheet-card-date">${fmtDate(s.dataPartita || s.data)}</div>
      </div>
      ${sum ? `
      <div class="rating-bar">
        <div class="rating-seg seg-v" style="flex:${sum.v||0.001}"></div>
        <div class="rating-seg seg-eq" style="flex:${sum.eq||0.001}"></div>
        <div class="rating-seg seg-x" style="flex:${sum.x||0.001}"></div>

      ${s.linkDocumento ? `<a href="${escapeHtml(s.linkDocumento)}" target="_blank" rel="noopener" class="sheet-doc-link" data-stop-propagation="1">📎 Collegamento</a>` : ''}
      ${Array.isArray(s.immagini) && s.immagini.length ? `<span class="sheet-doc-link">🖼 ${s.immagini.length} foto</span>` : ''}

// Le schede si archiviano raggruppate per categoria e, dentro ogni categoria, per squadra
// (la categoria viene dedotta automaticamente dal nome squadra scritto sulla scheda,
// cercandolo tra le squadre censite in "Squadre"). Dentro ogni gruppo restano in ordine
// cronologico, più recenti prima.
function renderSchedeList(){
  const list = [...state.sheets].sort((a,b) => (b.data||'').localeCompare(a.data||''));
  if(list.length===0){
    return `<div class="empty-state">
      <div class="icon">📋</div>
      <p><strong>Nessuna scheda salvata.</strong></p>
      <p>Tocca "+ Nuova" per creare la prima osservazione giocatore.</p>
    </div>`;
  }

  const groups = new Map(); // categoria -> Map(squadra -> scheda[])
  list.forEach(s => {
    const cat = (s.categoria || '').trim() || 'Senza categoria';
    const sq = (s.squadra || '').trim() || 'Senza squadra';
    if(!groups.has(cat)) groups.set(cat, new Map());
    const catMap = groups.get(cat);
    if(!catMap.has(sq)) catMap.set(sq, []);
    catMap.get(sq).push(s);
  });
  // "Senza categoria" sempre in fondo, le altre in ordine alfabetico
  const catNames = [...groups.keys()].sort((a,b) => {
    if(a==='Senza categoria') return 1;
    if(b==='Senza categoria') return -1;
    return a.localeCompare(b,'it');
  });

  return catNames.map(cat => {
    const catMap = groups.get(cat);
    const sqNames = [...catMap.keys()].sort((a,b) => {
      if(a==='Senza squadra') return 1;
      if(b==='Senza squadra') return -1;
      return a.localeCompare(b,'it');
    });
    return `
      <div class="schede-cat-title">${escapeHtml(cat)}</div>
      ${sqNames.map(sq => `
        <div class="schede-team-title">${escapeHtml(sq)} <span class="schede-team-count">${catMap.get(sq).length}</span></div>
        ${catMap.get(sq).map(s => renderSheetCard(s)).join('')}
      `).join('')}
    `;
  }).join('');
}

function openEditSheet(id){
  const s = state.sheets.find(x=>x.id===id);
  if(!s) return;
  let draft;
  try{
    draft = JSON.parse(JSON.stringify(s));
  }catch(e){
    draft = Object.assign({}, s);
  }
  // blinda ogni campo contro schede vecchie salvate prima che esistesse: mai lasciare
  // undefined/null qui dentro, altrimenti il render della scheda va in errore e l'app
  // resta bloccata sulla schermata precedente.
  if(typeof draft.giocatore !== 'string') draft.giocatore = '';
  if(typeof draft.squadra !== 'string') draft.squadra = '';
  if(typeof draft.categoria !== 'string') draft.categoria = '';
  if(typeof draft.ruolo !== 'string') draft.ruolo = '';
  if(typeof draft.piede !== 'string') draft.piede = '';
  if(typeof draft.data !== 'string') draft.data = '';
  if(typeof draft.minuti !== 'string' && typeof draft.minuti !== 'number') draft.minuti = '';
  if(typeof draft.valoreMercato !== 'string') draft.valoreMercato = '';
  if(typeof draft.altezza !== 'string' && typeof draft.altezza !== 'number') draft.altezza = '';
  if(typeof draft.struttura !== 'string') draft.struttura = '';
  if(typeof draft.nazionalita !== 'string') draft.nazionalita = '';
  if(typeof draft.partita !== 'string') draft.partita = '';
  if(typeof draft.dataPartita !== 'string') draft.dataPartita = '';
  if(typeof draft.osservazioni !== 'string') draft.osservazioni = '';
  if(!Array.isArray(draft.altreOsservazioni)) draft.altreOsservazioni = [];
  draft.altreOsservazioni = draft.altreOsservazioni
    .filter(o => o && typeof o === 'object')
    .map(o => ({ id: typeof o.id === 'string' ? o.id : uid(), data: typeof o.data === 'string' ? o.data : '', testo: typeof o.testo === 'string' ? o.testo : '' }));
  if(typeof draft.linkDocumento !== 'string') draft.linkDocumento = '';
  if(!draft.ratings || typeof draft.ratings !== 'object') draft.ratings = {};
  if(!draft.team1 || typeof draft.team1 !== 'object') draft.team1 = { nome:'', modulo:'' };
  if(typeof draft.team1.nome !== 'string') draft.team1.nome = '';
  if(typeof draft.team1.modulo !== 'string') draft.team1.modulo = '';
  if(!draft.team2 || typeof draft.team2 !== 'object') draft.team2 = { nome:'', modulo:'' };
  if(typeof draft.team2.nome !== 'string') draft.team2.nome = '';
  if(typeof draft.team2.modulo !== 'string') draft.team2.modulo = '';
  if(!draft.pitch || typeof draft.pitch !== 'object') draft.pitch = { markers:[], arrows:[] };
  if(!Array.isArray(draft.pitch.markers)) draft.pitch.markers = [];
  if(!Array.isArray(draft.pitch.arrows)) draft.pitch.arrows = [];
  if(!Array.isArray(draft.immagini)) draft.immagini = [];
  if(typeof draft.id !== 'string') draft.id = id;
  state.scheda.draft = draft;
  state.scheda.editingId = id;
  state.scheda.view = 'form';
  render();
}
/* "Seconda visualizzazione": duplica la scheda del giocatore aperta, tenendo tutti i dati
   uguali (ruolo, valutazioni, campo, foto...) e ripartendo solo dai campi Partita, Data
   partita e Osservazioni, così una nuova visione dello stesso giocatore non cancella
   la scheda precedente ma ne crea una nuova collegata alla stessa base dati. */
function duplicateSheetForSecondViewing(){
  const src = state.scheda.draft;
  if(!src) return;
  let clone;
  try{ clone = JSON.parse(JSON.stringify(src)); }
  catch(e){ clone = Object.assign({}, src); }
  clone.id = uid();
  clone.partita = '';
  clone.dataPartita = new Date().toISOString().slice(0,10);
  clone.osservazioni = '';
  clone.altreOsservazioni = [];
  state.scheda.draft = clone;
  state.scheda.editingId = null;
  state.scheda.view = 'form';
  toast('Nuova visualizzazione creata: compila partita e osservazioni');
  render();
}
function persistDraftSheet(){
  const d = state.scheda.draft;
  const idx = state.sheets.findIndex(s=>s.id===d.id);
  if(idx>=0) state.sheets[idx] = d; else state.sheets.push(d);
  saveSheets(state.sheets);
}

function wirePhotoGridEvents(){
  document.querySelectorAll('[data-remove-photo-idx]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const i = parseInt(btn.dataset.removePhotoIdx,10);
      const d = state.scheda.draft;
      const img = d.immagini[i];
      if(!img) return;
      d.immagini.splice(i,1);

      toast('Foto rimossa');
    });
  });
}

/* Blocco valutazione: cambia da solo tra giocatore di movimento e portiere. */
function renderRatingsBlock(d){
  const groups = ratingGroupsFor(d.ruolo);
  const title = isPortiere(d.ruolo) ? 'Valutazione portiere' : 'Valutazione';
  return `
    <div class="section-label">${title} — X scarso · = nella media · V valido</div>
    ${Object.entries(groups).map(([group, attrs]) => `
      <div class="rating-group">
        <div class="rating-group-title">${group}</div>
        ${attrs.map(attr => `
          <div class="rating-row">
            <span class="rating-label">${attr}</span>
            <div class="rating-toggle" data-attr="${attr}">
              ${['X','=','V'].map(val => `<button class="rt-btn rt-${val==='V'?'v':val==='X'?'x':'eq'} ${d.ratings[attr]===val?'active':''}" data-val="${val}">${val}</button>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `).join('')}
  `;
}
function wireRatingToggles(){
  const d = state.scheda.draft;
  document.querySelectorAll('#ratings-block .rating-toggle').forEach(group => {
    group.querySelectorAll('.rt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const attr = group.dataset.attr;
        const val = btn.dataset.val;
        d.ratings[attr] = d.ratings[attr] === val ? undefined : val;
        group.querySelectorAll('.rt-btn').forEach(b => b.classList.toggle('active', d.ratings[attr]===b.dataset.val));
      });
    });
  });
}
function refreshRatingsBlock(){
  const box = document.getElementById('ratings-block');
  if(!box) return;
  box.innerHTML = renderRatingsBlock(state.scheda.draft);
  wireRatingToggles();
}

/* Osservazioni multiple: la prima resta nel campo storico "osservazioni" (così le schede
   già salvate non cambiano), le successive (2ª, 3ª...) stanno in "altreOsservazioni". */
function renderOsservazioniBlock(d){
  const extra = Array.isArray(d.altreOsservazioni) ? d.altreOsservazioni : [];
  const multi = extra.length > 0;
  return `
    <div class="field" style="margin-bottom:10px;">
      ${multi ? `<label>Osservazione 1</label>` : ''}
      <textarea id="f-osservazioni" rows="4" placeholder="Note libere sull'osservazione...">${escapeHtml(d.osservazioni)}</textarea>
    </div>
    ${extra.map((o,i) => `
      <div class="field obs-extra" style="margin-bottom:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;">
          <label style="margin:0;">Osservazione ${i+2}</label>
          <div style="display:flex;align-items:center;gap:8px;">
            <input type="date" data-obs-date="${i}" value="${escapeHtml(o.data||'')}" style="width:auto;">
            <button type="button" class="btn btn-secondary" data-obs-remove="${i}" aria-label="Rimuovi osservazione ${i+2}" style="width:auto;padding:6px 10px;">✕</button>
          </div>
        </div>
        <textarea rows="4" data-obs-text="${i}" placeholder="Note sull'osservazione ${i+2}...">${escapeHtml(o.testo||'')}</textarea>
      </div>
    `).join('')}
    <button type="button" class="btn btn-secondary" id="obs-add">➕ Aggiungi osservazione</button>
  `;
}
function wireOsservazioniBlock(){
  const d = state.scheda.draft;
  if(!Array.isArray(d.altreOsservazioni)) d.altreOsservazioni = [];
  const first = document.getElementById('f-osservazioni');
  if(first){
    const upd = () => { d.osservazioni = first.value; };
    first.addEventListener('input', upd); first.addEventListener('change', upd);
  }
  document.querySelectorAll('[data-obs-text]').forEach(el => {
    const i = parseInt(el.dataset.obsText,10);
    const upd = () => { if(d.altreOsservazioni[i]) d.altreOsservazioni[i].testo = el.value; };
    el.addEventListener('input', upd); el.addEventListener('change', upd);
  });
  document.querySelectorAll('[data-obs-date]').forEach(el => {
    const i = parseInt(el.dataset.obsDate,10);
    el.addEventListener('change', () => { if(d.altreOsservazioni[i]) d.altreOsservazioni[i].data = el.value; });
  });
  document.querySelectorAll('[data-obs-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.obsRemove,10);
      const o = d.altreOsservazioni[i];
      const doRemove = () => { d.altreOsservazioni.splice(i,1); refreshOsservazioniBlock(); };
      // se c'è già del testo scritto chiede conferma, per non perdere note per un tocco sbagliato
      if(o && String(o.testo||'').trim()) showConfirm('Eliminare questa osservazione?', doRemove);
      else doRemove();
    });
  });
  const addBtn = document.getElementById('obs-add');
  if(addBtn) addBtn.addEventListener('click', () => {
    d.altreOsservazioni.push({ id: uid(), data: new Date().toISOString().slice(0,10), testo: '' });
    refreshOsservazioniBlock();
    const tas = document.querySelectorAll('[data-obs-text]');
    if(tas.length) tas[tas.length-1].focus();
  });
}
function refreshOsservazioniBlock(){
  const box = document.getElementById('osservazioni-block');
  if(!box) return;
  box.innerHTML = renderOsservazioniBlock(state.scheda.draft);
  wireOsservazioniBlock();
}

/* ============ EVENT WIRING ============ */
function wireTabEvents(){
  if(state.tab === 'scout') wireScoutEvents();
  else if(state.tab === 'libreria') wireScoutArchivioEvents();
  else if(state.tab === 'calendario'){
    if(state.calView === 'import') wireImportEvents();
    else wireCalendarioEvents();
  }
  else if(state.tab === 'squadre'){
    if(state.squadreView === 'import') wireSquadreImportEvents();
    else wireSquadreEvents();
  }
  else if(state.tab === 'schede'){
    if(state.scheda.view === 'list') wireSchedeListEvents();
    else wireSchedaFormEvents();
  }
}

function wireScoutEvents(){
  document.querySelectorAll('[data-match-id]').forEach(el => {
    el.addEventListener('change', () => {
      const m = state.matches.find(x=>x.id===el.dataset.matchId);
      if(m){ m[el.dataset.field] = el.value; saveMatches(state.matches); }
    });
  });
  document.querySelectorAll('[data-vista-match-id]').forEach(chip => {
    chip.addEventListener('click', () => {
      const m = state.matches.find(x=>x.id===chip.dataset.vistaMatchId);
      if(m){
        m.modalita = m.modalita === chip.dataset.vistaVal ? '' : chip.dataset.vistaVal;
        saveMatches(state.matches);
        document.getElementById('page-content').innerHTML = renderScoutTab();
        wireScoutEvents();
      }
    });
  });
  document.querySelectorAll('[data-archive-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = state.matches.find(x=>x.id===btn.dataset.archiveId);
      if(m){
        m.archiviata = true;
        const counted = applyMatchToSquadreCounter(m);
        saveMatches(state.matches);
        document.getElementById('page-content').innerHTML = renderScoutTab();
        wireScoutEvents();
        toast(counted ? 'Archiviata — contatore Squadre aggiornato' : 'Partita archiviata nella libreria');
      }
    });
  });
  document.querySelectorAll('[data-ics-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = state.matches.find(x=>x.id===btn.dataset.icsId);
      if(m){
        window.open(gcalEventUrl(m), '_blank');
      }
    });
  });
  const btnAll = document.getElementById('btn-export-all-ics');
  if(btnAll){
    btnAll.addEventListener('click', () => {
      const list = state.matches.filter(m => m.daVedere && !m.archiviata);
      if(list.length === 0) return;
      downloadICS('partite-da-vedere.ics', buildICS(list));
      toast(`${list.length} partite scaricate — se il file non si apre, usa "📅 Calendario" su ogni singola partita`);
    });
  }
}

function wireCalendarioEvents(){
  const search = document.getElementById('cal-search');
  if(search){
    search.addEventListener('input', () => {
      state.calFilter.search = search.value;
      const page = document.getElementById('page-content');
      page.innerHTML = renderCalendarioTab();
      wireCalendarioEvents();
      document.getElementById('cal-search').focus();
      document.getElementById('cal-search').setSelectionRange(search.value.length, search.value.length);
    });
  }
  document.querySelectorAll('#cal-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      state.calFilter.comp = chip.dataset.comp;
      document.getElementById('page-content').innerHTML = renderCalendarioTab();
      wireCalendarioEvents();
      scrollToCalendarioToday();
    });
  });
  const delFiltered = document.getElementById('btn-delete-filtered');
  if(delFiltered){
    delFiltered.addEventListener('click', () => {
      const label = calChipLabel(state.calFilter.comp);
      const toRemove = state.matches.filter(m => matchesChip(m, state.calFilter.comp) &&
        (!state.calFilter.search || `${m.casa} ${m.ospite}`.toLowerCase().includes(state.calFilter.search.toLowerCase())));
      if(toRemove.length === 0) return;
      showConfirm(`Eliminare tutte le ${toRemove.length} partite di "${label}"?`, () => {
        const removeIds = new Set(toRemove.map(m=>m.id));
        toRemove.forEach(m => revertMatchToSquadreCounter(m));
        state.matches = state.matches.filter(m => !removeIds.has(m.id));
        saveMatches(state.matches);
        state.calFilter.comp = 'Tutte';
        document.getElementById('page-content').innerHTML = renderCalendarioTab();
        wireCalendarioEvents();
        toast(`${toRemove.length} partite eliminate`);
      });
    });
  }
  document.querySelectorAll('[data-toggle-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = state.matches.find(x=>x.id===btn.dataset.toggleId);
      if(m){
        m.daVedere = !m.daVedere;
        saveMatches(state.matches);
        document.getElementById('page-content').innerHTML = renderCalendarioTab();
        wireCalendarioEvents();
        toast(m.daVedere ? 'Aggiunta a "Da vedere"' : 'Rimossa da "Da vedere"');
      }
    });
  });
  document.querySelectorAll('[data-delete-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = state.matches.find(x=>x.id===btn.dataset.deleteId);
      if(!m) return;
      showConfirm(`Eliminare ${m.casa} - ${m.ospite}?`, () => {
        revertMatchToSquadreCounter(m);
        state.matches = state.matches.filter(x=>x.id!==m.id);
        saveMatches(state.matches);
        document.getElementById('page-content').innerHTML = renderCalendarioTab();
        wireCalendarioEvents();
        toast('Partita eliminata');
      });
    });
  });
}

function wireImportEvents(){
  const d = state.importDraft;
  const bind = (id, prop) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', () => { d[prop] = el.value; });
  };
  bind('imp-comp','competizione');
  bind('imp-girone','girone');
  bind('imp-text','text');
  const annoEl = document.getElementById('imp-anno');
  if(annoEl) annoEl.addEventListener('input', () => { d.anno = parseInt(annoEl.value,10) || d.anno; });

  const photoInput = document.getElementById('imp-photo');
  if(photoInput) photoInput.addEventListener('change', async () => {
    const file = photoInput.files[0];
    if(!file) return;
    const label = document.getElementById('imp-photo-label');
    if(label) label.textContent = 'Lettura in corso...';
    toast('Sto leggendo la foto...');
    try{
      await loadTesseract();
      const result = await Tesseract.recognize(file, 'ita');
      const recognized = (result && result.data && result.data.text) ? result.data.text.trim() : '';
      d.text = d.text ? (d.text + '\n' + recognized) : recognized;
      const ta = document.getElementById('imp-text');
      if(ta) ta.value = d.text;
      toast(recognized ? 'Testo riconosciuto: controlla e correggi' : 'Non ho riconosciuto testo nella foto');
    }catch(err){
      toast('Non sono riuscito a leggere la foto');
    }
    if(label) label.textContent = '\ud83d\udcf7 Scegli foto / scatta';
    photoInput.value = '';
  });

  const btn = document.getElementById('btn-do-import');
  if(btn) btn.addEventListener('click', () => {
    if(!d.text.trim()){ toast('Incolla il testo del calendario'); document.getElementById('imp-text').focus(); return; }
    const parsed = parseCalendarText(d.text, d.anno);
    if(parsed.length === 0){ toast('Nessuna partita riconosciuta'); return; }
    const hasNoContext = parsed.some(p => !p.competizione) && !d.competizione.trim();
    if(hasNoContext){ toast('Inserisci la competizione, oppure aggiungi intestazioni "## Competizione | Girone" nel testo'); document.getElementById('imp-comp').focus(); return; }
    let added = 0, updated = 0;
    parsed.forEach(p => {
      const comp = (p.competizione || d.competizione.trim());
      const girone = (p.girone || d.girone.trim() || null);
      const existing = state.matches.find(m =>
        (m.competizione||'').toLowerCase()===comp.toLowerCase() &&
        m.casa.toLowerCase()===p.casa.toLowerCase() &&
        m.ospite.toLowerCase()===p.ospite.toLowerCase()
      );
      if(existing){
        if(existing.data !== p.data || existing.ora !== p.ora || existing.girone !== girone){
          existing.data = p.data;
          existing.ora = p.ora;
          existing.girone = girone;
          updated++;
        }
      } else {
        state.matches.push({
          id: uid(), data: p.data, ora: p.ora, competizione: comp,
          girone: girone, casa: p.casa, ospite: p.ospite,
          stadio: null, daVedere: false, obiettivo: '', note: ''
        });
        added++;
      }
    });
    saveMatches(state.matches);
    toast(`${added} nuove, ${updated} aggiornate (su ${parsed.length} trovate)`);
    d.text = '';
    state.calView = 'list';
    render();
  });
}

function wireSquadreEvents(){
  document.querySelectorAll('[data-summary-comp]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.squadreFilter.comp = btn.dataset.summaryComp;
      state.squadreFilter.girone = 'Tutte';
      document.getElementById('page-content').innerHTML = renderSquadreTab();
      wireSquadreEvents();
    });
  });
  document.querySelectorAll('#squadre-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      state.squadreFilter.comp = chip.dataset.comp;
      state.squadreFilter.girone = 'Tutte';
      document.getElementById('page-content').innerHTML = renderSquadreTab();
      wireSquadreEvents();
    });
  });
  document.querySelectorAll('#squadre-girone-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      state.squadreFilter.girone = chip.dataset.girone;
      document.getElementById('page-content').innerHTML = renderSquadreTab();
      wireSquadreEvents();
    });
  });
  document.querySelectorAll('[data-rename-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      const oldCat = btn.dataset.renameCat;
      const newCat = prompt(`Rinomina categoria:`, oldCat);
      if(!newCat || !newCat.trim() || newCat.trim() === oldCat) return;
      const newCatTrim = newCat.trim();
      const existingNames = new Set(state.teams.filter(t=>t.categoria===newCatTrim).map(t=>t.squadra.toLowerCase()));
      let merged = 0;
      state.teams.forEach(t => {
        if(t.categoria === oldCat){
          if(existingNames.has(t.squadra.toLowerCase())){
            t._remove = true;
            merged++;
          } else {
            t.categoria = newCatTrim;
          }
        }
      });
      if(merged>0) state.teams = state.teams.filter(t=>!t._remove);
      saveTeams(state.teams);
      state.squadreFilter.comp = 'Tutte';
      state.squadreFilter.girone = 'Tutte';
      document.getElementById('page-content').innerHTML = renderSquadreTab();
      wireSquadreEvents();
      toast(`Categoria rinominata in "${newCatTrim}"${merged>0 ? ` (${merged} doppioni rimossi)` : ''}`);
    });
  });
  document.querySelectorAll('[data-delete-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.dataset.deleteCat;

function buildSchedaText(d){
  const lines = [];
  lines.push(`SCHEDA SCOUTING — ${d.giocatore || '—'}`);
  lines.push(`Squadra: ${d.squadra||'—'}   Ruolo: ${d.ruolo||'—'}   Piede: ${d.piede||'—'}`);
  lines.push(`Data di nascita: ${d.data||'—'}   Valore di mercato: ${d.valoreMercato||'—'}   Minuti osservati: ${d.minuti||'—'}`);
  lines.push(`Altezza: ${d.altezza ? d.altezza+' cm' : '—'}   Struttura: ${d.struttura||'—'}   Nazionalità: ${d.nazionalita||'—'}`);
  lines.push(`Partita: ${d.partita||'—'}   Data partita: ${d.dataPartita||'—'}`);
  lines.push('');
  lines.push(`${isPortiere(d.ruolo) ? 'VALUTAZIONE PORTIERE' : 'VALUTAZIONE'} (X scarso · = nella media · V valido)`);
  Object.entries(ratingGroupsFor(d.ruolo)).forEach(([group, attrs]) => {
    lines.push(`${group}:`);
    attrs.forEach(attr => { lines.push(`  - ${attr}: ${(d.ratings||{})[attr] || '—'}`); });
  });
  lines.push('');
  lines.push(`Formazione ${d.team1.nome || 'Team 1'} (modulo ${d.team1.modulo || '—'})`);
  lines.push(`Formazione ${d.team2.nome || 'Team 2'} (modulo ${d.team2.modulo || '—'})`);
  lines.push('');
  lines.push('OSSERVAZIONI');
  const extraObs = Array.isArray(d.altreOsservazioni) ? d.altreOsservazioni.filter(o => o && String(o.testo||'').trim()) : [];
  if(extraObs.length === 0){
    lines.push(d.osservazioni || '—');
  } else {
    lines.push('Osservazione 1:');
    lines.push(d.osservazioni || '—');
    extraObs.forEach((o,i) => {
      lines.push('');
      lines.push(`Osservazione ${i+2}${o.data ? ' ('+o.data+')' : ''}:`);
      lines.push(o.testo);
    });
  }
  return lines.join('\n');
}
/* ---- minimal in-browser .docx (OOXML/ZIP) builder, no external deps ---- */
function crc32Bytes(buf){
  if(!crc32Bytes.table){
    const table = [];
    for(let n=0;n<256;n++){
      let c = n;
      for(let k=0;k<8;k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
      table[n] = c >>> 0;
    }
    crc32Bytes.table = table;
  }
  let crc = 0 ^ (-1);
  for(let i=0;i<buf.length;i++){ crc = (crc >>> 8) ^ crc32Bytes.table[(crc ^ buf[i]) & 0xFF]; }
  return (crc ^ (-1)) >>> 0;
}
function strToUtf8Bytes(str){ return new TextEncoder().encode(str); }
function buildZipStored(files){
  const localParts = [], centralParts = [];
  let offset = 0;
  const dosTime = 0, dosDate = 0x21;
  files.forEach(f => {
    const nameBytes = strToUtf8Bytes(f.name);
    const data = f.data;
    const crc = crc32Bytes(data);
    const size = data.length;
    const local = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, dosTime, true);
    dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, size, true);
    dv.setUint32(22, size, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    localParts.push(local, data);

    const central = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(central.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, dosTime, true);
    cdv.setUint16(14, dosDate, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true);
    cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centralParts.push(central);

    offset += local.length + data.length;
  });
  const centralSize = centralParts.reduce((s,p)=>s+p.length,0);
  const centralOffset = offset;
  const end = new Uint8Array(22);
  const edv = new DataView(end.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, centralOffset, true);
  edv.setUint16(20, 0, true);
  const allParts = [...localParts, ...centralParts, end];
  const totalLen = allParts.reduce((s,p)=>s+p.length,0);
  const result = new Uint8Array(totalLen);
  let pos = 0;
  allParts.forEach(p => { result.set(p, pos); pos += p.length; });
  return result;
}

function svgStringToPngBytes(svgString, pxWidth, pxHeight){
  return new Promise((resolve, reject) => {
    try{
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        try{
          const canvas = document.createElement('canvas');
          canvas.width = pxWidth; canvas.height = pxHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, pxWidth, pxHeight);
          URL.revokeObjectURL(url);
          canvas.toBlob(blob => {
            if(!blob){ reject(new Error('toBlob failed')); return; }
            blob.arrayBuffer().then(buf => resolve(new Uint8Array(buf))).catch(reject);
          }, 'image/png');
        }catch(e){ URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    }catch(e){ reject(e); }
  });
}
