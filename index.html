              run('V', { sz: 17, b: true, color: '4B7A4E' }) + run(' valido', { sz: 17, color: GRIGIO }), { after: 100, keep: true });
  const groups = Object.entries(ratingGroupsFor(d.ruolo));
  const MARK = { 'X': 'A33B2C', '=': 'B08A2E', 'V': '4B7A4E' };
  const aw = 2825, mw = 560, gap = 900;
  const rw = [aw, mw, mw, mw, gap, aw, mw, mw, mw];
  const markCell = (attr, sym) => {
    const sel = ((d.ratings || {})[attr] === sym);
    return cell(par(run(sel ? sym : '', { b: true, sz: 20, color: 'FFFFFF' }), { jc: 'center', after: 0 }), { w: mw, fill: sel ? MARK[sym] : 'F4F1F8', padV: 40 });
  };
  const headCell = (g) => [
    cell(par(run(g, { b: true, sz: 19, color: 'FFFFFF', caps: true, sp: 20 }), { after: 0 }), { w: aw, fill: VIOLA, padV: 60 }),
    ...['X', '=', 'V'].map(s => cell(par(run(s, { b: true, sz: 18, color: 'FFFFFF' }), { jc: 'center', after: 0 }), { w: mw, fill: VIOLA, padV: 60 }))
  ].join('');
  const attrCells = (attr) => cell(par(run(attr, { sz: 20, color: TESTO }), { after: 0 }), { w: aw, padV: 40 }) + ['X', '=', 'V'].map(s => markCell(attr, s)).join('');
  const gapCell = cell(par('', { after: 0 }), { w: gap, padV: 20 });
  const blank = (w) => cell(par('', { after: 0 }), { w, padV: 40 });
  for(let i = 0; i < groups.length; i += 2){
    const [gA, attrsA] = groups[i];
    const [gB, attrsB] = groups[i + 1] || [null, []];
    let rows = row(headCell(gA) + gapCell + (gB ? headCell(gB) : blank(aw) + blank(mw) + blank(mw) + blank(mw)));
    const n = Math.max(attrsA.length, attrsB.length);
    for(let k = 0; k < n; k++){
      rows += row(
        (attrsA[k] ? attrCells(attrsA[k]) : blank(aw) + blank(mw) + blank(mw) + blank(mw)) + gapCell +
        (attrsB[k] ? attrCells(attrsB[k]) : blank(aw) + blank(mw) + blank(mw) + blank(mw))
      );
    }
    body += table(rw, rows, { borders: 'none' });
    body += spacer(100);
  }

  /* --- formazioni --- */
  body += heading('Formazioni');
  const t1 = d.team1 || {}, t2 = d.team2 || {};
  const fw = [4903, 100, 4903];
  const fcell = (t, def, w) => cell(
    par(run(t.nome || def, { font: 'Georgia', b: true, sz: 24, color: VIOLA }), { after: 0 }) +
    par(run('Modulo  ', { sz: 17, color: GRIGIO }) + run(t.modulo || '—', { b: true, sz: 21, color: TESTO }), { after: 0 }), { w, fill: 'F7F3FB', padV: 100 });
  body += table(fw, row(fcell(t1, 'Squadra 1', fw[0]) + cell(par('', { after: 0 }), { w: fw[1] }) + fcell(t2, 'Squadra 2', fw[2])), { borders: 'none' });
  body += spacer(100);

  if(image && image.bytes && image.bytes.length){
    const cx = 2286000, cy = Math.round(cx * (image.h / image.w));
    body += par(run('Schieramento tattico', { b: true, sz: 19, color: VIOLA }), { after: 60, keep: true, jc: 'center' });
    body += `<w:p><w:pPr><w:spacing w:before="0" w:after="120"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="1" name="Campo"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="0" name="Campo"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdImg1"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
  }

  /* --- osservazioni --- */
  body += heading('Osservazioni');
  const textBlock = (txt) => String(txt || '—').split('\n').map(l => par(run(l, { sz: 21, color: TESTO }), { after: 80 })).join('');
  const extra = Array.isArray(d.altreOsservazioni) ? d.altreOsservazioni.filter(o => o && String(o.testo || '').trim()) : [];
  const obsTitle = (n, dateTxt) => table([9906], row(
    cell(par(run('Osservazione ' + n, { b: true, sz: 20, color: 'FFFFFF', caps: true, sp: 30 }), { after: 0, keep: true }), { w: dateTxt ? 6906 : 9906, fill: VIOLA, padV: 70 }) +
    (dateTxt ? cell(par(run(dateTxt, { sz: 19, color: 'E4D6F2' }), { after: 0, jc: 'right', keep: true }), { w: 3000, fill: VIOLA, padV: 70 }) : '')
  ), { borders: 'none' }) + par('', { after: 40 });
  if(extra.length === 0){
    body += obsTitle(1, '') + textBlock(d.osservazioni);
  } else {
    [{ testo: d.osservazioni, data: '' }].concat(extra).forEach((o, i) => { body += obsTitle(i + 1, i && o.data ? dxDate(o.data) : '') + textBlock(o.testo) + spacer(80); });
  }

  const sect = '<w:sectPr><w:footerReference w:type="default" r:id="rIdFooter"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="900" w:right="1000" w:bottom="900" w:left="1000" w:header="500" w:footer="500" w:gutter="0"/></w:sectPr>';
  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${body}${sect}</w:body></w:document>`;
  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:color w:val="${TESTO}"/><w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="it-IT"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="60" w:line="259" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:pBdr><w:bottom w:val="single" w:sz="8" w:space="2" w:color="${VIOLA}"/></w:pBdr><w:spacing w:before="200" w:after="120"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/><w:b/><w:color w:val="${VIOLA}"/><w:sz w:val="26"/><w:szCs w:val="26"/></w:rPr></w:style></w:styles>`;
  const footerXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:p><w:pPr><w:pBdr><w:top w:val="single" w:sz="4" w:space="4" w:color="${LINEA}"/></w:pBdr><w:spacing w:before="0" w:after="0"/><w:jc w:val="center"/></w:pPr>${run('Scouting Ostiamare  ·  ' + nome + '  ·  pagina ', { sz: 16, color: GRIGIO })}<w:fldSimple w:instr=" PAGE "><w:r><w:rPr><w:color w:val="${GRIGIO}"/><w:sz w:val="16"/></w:rPr><w:t>1</w:t></w:r></w:fldSimple></w:p></w:ftr>`;
  const files = [];
  let imgCT = '', rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdFooter" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>`;
  if(image && image.bytes && image.bytes.length){
    files.push({ name: 'word/media/image1.png', data: image.bytes });
    imgCT = '<Default Extension="png" ContentType="image/png"/>';
    rels += '<Relationship Id="rIdImg1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image1.png"/>';
  }
  rels += '</Relationships>';
  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>${imgCT}<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`;
  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  files.push(
    { name: '[Content_Types].xml', data: strToUtf8Bytes(contentTypes) },
    { name: '_rels/.rels', data: strToUtf8Bytes(rootRels) },
    { name: 'word/_rels/document.xml.rels', data: strToUtf8Bytes(rels) },
    { name: 'word/styles.xml', data: strToUtf8Bytes(stylesXml) },
    { name: 'word/footer1.xml', data: strToUtf8Bytes(footerXml) },
    { name: 'word/document.xml', data: strToUtf8Bytes(documentXml) }
  );
  const zipBytes = buildZipStored(files);
  return new Blob([zipBytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}
async function exportSchedaAsDoc(){
  const d = state.scheda.draft;
  const fullText = buildSchedaText(d);
  const splitAt = fullText.indexOf('OSSERVAZIONI');
  const topText = splitAt >= 0 ? fullText.slice(0, splitAt).replace(/\n+$/,'') : fullText;
  const bottomText = splitAt >= 0 ? fullText.slice(splitAt) : '';
  const title = `Scheda — ${d.giocatore || 'Giocatore'}`;
  const safeName = (d.giocatore || 'Giocatore').replace(/[\\/:*?"<>|]/g, '-').trim() || 'Giocatore';

  let image = null;
  const hasPitchContent = (d.pitch && ((d.pitch.markers||[]).length || (d.pitch.arrows||[]).length));
  if(hasPitchContent){
    try{
      const svgString = buildStandalonePitchSvg(d);
      const w = 400, h = 618;
      const bytes = await svgStringToPngBytes(svgString, w, h);
      image = { bytes, w, h };
    }catch(e){ image = null; }
  }

  const docxFilename = `Scheda ${safeName}.docx`;

  let downloads = null;
  try{
    downloads = window.claude ? await window.claude.use('downloads') : null;
  }catch(e){ downloads = null; }
  if(downloads){
    try{
      const blob = buildDocxBlob(d, image);
      await downloads.save({ filename: docxFilename, data: blob });
      toast('Scheda esportata in Word');
      return;
    }catch(err){
      if(err && err.code === 'declined') return;
      // qualsiasi altro errore: prova il download nativo del browser sotto
    }
  }
  try{
    const blob = buildDocxBlob(d, image);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = docxFilename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('Scheda esportata in Word');
    return;
  }catch(e){
    // qualsiasi altro errore: fallback al testo copiabile
  }
  showExportText(title, fullText);
}
function showExportText(title, text){
  const overlay = getModalOverlay();
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:420px;">
      <p class="modal-message">${escapeHtml(title)}<br><span style="font-size:12px;color:var(--text-dim);">Seleziona e copia il testo, poi incollalo in un Documento Google o Word.</span></p>
      <textarea id="modal-export-text" class="modal-input" style="height:220px;resize:vertical;font-family:monospace;font-size:12px;" readonly>${escapeHtml(text)}</textarea>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">Chiudi</button>
        <button class="btn btn-primary" id="modal-copy">Copia testo</button>
      </div>
    </div>
  `;
  overlay.classList.add('show');
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
  const ta = document.getElementById('modal-export-text');
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-copy').onclick = () => {
    ta.focus(); ta.select();
    let copied = false;
    try{ copied = document.execCommand('copy'); }catch(e){ copied = false; }
    if(copied){ toast('Testo copiato'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text)
        .then(() => toast('Testo copiato'))
        .catch(() => toast('Copia non riuscita: seleziona il testo a mano e copialo'));
    } else {
      toast('Copia non riuscita: seleziona il testo a mano e copialo');
    }
  };
}

function refreshPitch(){
  const d = state.scheda.draft;
  document.getElementById('pitch-arrows').innerHTML = d.pitch.arrows.map((a,i) =>
    `<line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" class="pitch-arrow" stroke="${a.team===1?'var(--team1)':'var(--team2)'}" marker-end="url(#arrowhead-${a.team})" data-arrow-idx="${i}"/>`
  ).join('');
  document.getElementById('pitch-markers').innerHTML = d.pitch.markers.map((m,i) => `
    <circle cx="${m.x}" cy="${m.y}" r="2.6" class="pitch-marker" fill="${m.team===1?'var(--team1)':'var(--team2)'}" data-marker-idx="${i}"/>
    <text x="${m.x}" y="${m.y+1}" class="pitch-marker-label" text-anchor="middle" font-size="2.6" data-marker-idx="${i}">${m.label}</text>
  `).join('');
  wirePitchSvg();
}

function wirePitchSvg(){
  const svg = document.getElementById('pitch-svg');
  if(!svg) return;
  const d = state.scheda.draft;

  svg.querySelectorAll('[data-marker-idx]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = parseInt(el.dataset.markerIdx,10);
      const cur = d.pitch.markers[i];
      showPrompt('Numero maglia (lascia vuoto per rimuovere il giocatore):', cur.label, (val) => {
        const trimmed = val.trim();
        if(trimmed === ''){
          d.pitch.markers.splice(i,1);
        } else {
          cur.label = trimmed.slice(0,2);
        }
        refreshPitch();
      });
    });
  });
  svg.querySelectorAll('[data-arrow-idx]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = parseInt(el.dataset.arrowIdx,10);
      d.pitch.arrows.splice(i,1);
      refreshPitch();
    });
  });

  svg.onclick = (e) => {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    const x = Math.max(1, Math.min(67, loc.x));
    const y = Math.max(1, Math.min(104, loc.y));

    if(state.scheda.pitchMode === 'player'){
      const team = state.scheda.pitchTeam;
      const countSameTeam = d.pitch.markers.filter(m=>m.team===team).length;
      showPrompt('Numero maglia del giocatore:', String(countSameTeam+1), (val) => {
        const trimmed = val.trim();
        const label = trimmed === '' ? String(countSameTeam+1) : trimmed.slice(0,2);
        d.pitch.markers.push({ x, y, team, label });
        refreshPitch();
      });
    } else {
      if(!state.scheda.pendingArrow){
        state.scheda.pendingArrow = { x, y };
        toast('Tocca il punto di arrivo della freccia');
      } else {
        d.pitch.arrows.push({ x1: state.scheda.pendingArrow.x, y1: state.scheda.pendingArrow.y, x2:x, y2:y, team: state.scheda.pitchTeam });
        state.scheda.pendingArrow = null;
        refreshPitch();
      }
    }
  };
}

applyTheme(localStorage.getItem(LS.theme) || 'referto');
restoreUIState();
render();
if(_dupCleanup && _dupCleanup.totale > 0){
  const parts = [];
  if(_dupCleanup.partite) parts.push(_dupCleanup.partite + ' partite');
  if(_dupCleanup.schede) parts.push(_dupCleanup.schede + ' schede');
  if(_dupCleanup.squadre) parts.push(_dupCleanup.squadre + ' squadre');
  setTimeout(() => toast('Doppioni rimossi: ' + parts.join(', ')), 400);
}

/* exposed for debugging in devtools console */
window.state = state;
window.render = render;
window.openNewSheet = openNewSheet;
window.refreshPitch = refreshPitch;



if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
